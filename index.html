<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オファー人数</title>

<style>
  body {
    font-family: sans-serif;
    background: #f4f4f6;
    margin: 0;
    padding: 16px;
  }
  h1 {
    font-size: 20px;
  }
  .kai {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .kai-atama {
    cursor: pointer;
  }
  .event-mei {
    font-size: 13px;
    color: #888;
  }
  .hizuke {
    font-size: 18px;
    font-weight: bold;
    margin: 4px 0;
  }
  .nokori {
    font-size: 22px;
    font-weight: bold;
    color: #d33;
    margin: 8px 0;
  }
  .nokori.ok {
    color: #2a2;
  }
  .namae-list {
    font-size: 14px;
    color: #555;
  }
  .nyuuryoku {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #eee;
  }
  .nyuuryoku input {
    font-size: 16px;
    padding: 8px;
    width: 60%;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .nyuuryoku button {
    font-size: 16px;
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: #333;
    color: white;
    margin-left: 6px;
  }
  #joutai {
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
  }
</style>
</head>

<body>

<h1>オファー人数</h1>

<div id="joutai">読み込み中...</div>

<!-- ここが空っぽの箱。この中に回が書き出される -->
<div id="ireru-basho"></div>


<script>
// ------------------------------
// データ（最初は空。受付からもらう）
// ------------------------------
let kaiList = [];


// ------------------------------
// 受付から、データをもらってくる
// ------------------------------
async function yomikomu() {
  const henji = await fetch("/api");
  const data = await henji.json();

  // もらったデータに「開いている」の印をつける
  for (const kai of data) {
    kai.hiraiteru = false;
  }

  kaiList = data;

  document.getElementById("joutai").textContent = "";
  kakidasu();
}


// ------------------------------
// 受付に、データを預ける
// ------------------------------
function hozon() {
  // 「開いている」の印は保存しなくていいので、外したものを作る
  const okuruMono = kaiList.map(function (kai) {
    return {
      eventMei: kai.eventMei,
      hizuke: kai.hizuke,
      hitsuyouNinzuu: kai.hitsuyouNinzuu,
      shutsuensha: kai.shutsuensha
    };
  });

  fetch("/api", {
    method: "POST",
    body: JSON.stringify(okuruMono)
  });
}


// ------------------------------
// 開く / 閉じるを切り替える
// ------------------------------
function kirikaeru(bangou) {
  kaiList[bangou].hiraiteru = !kaiList[bangou].hiraiteru;
  kakidasu();
}


// ------------------------------
// 名前を1つ足す
// ------------------------------
function namaeWoTasu(bangou) {
  const ran = document.getElementById("namae-ran-" + bangou);
  const namae = ran.value.trim();

  if (namae === "") {
    return;
  }

  kaiList[bangou].shutsuensha.push(namae);

  kakidasu();
  hozon();
}


// ------------------------------
// 画面に書き出す
// ------------------------------
function kakidasu() {
  const basho = document.getElementById("ireru-basho");
  basho.innerHTML = "";

  for (let bangou = 0; bangou < kaiList.length; bangou++) {
    const kai = kaiList[bangou];

    const nokori = kai.hitsuyouNinzuu - kai.shutsuensha.length;

    let nokoriMoji;
    if (nokori > 0) {
      nokoriMoji = "あと " + nokori + " 人";
    } else {
      nokoriMoji = "そろった";
    }

    let nyuuryokuBubun = "";
    if (kai.hiraiteru) {
      nyuuryokuBubun =
        '<div class="nyuuryoku">' +
          '<input id="namae-ran-' + bangou + '" placeholder="名前">' +
          '<button onclick="namaeWoTasu(' + bangou + ')">追加</button>' +
        '</div>';
    }

    const card = document.createElement("div");
    card.className = "kai";

    card.innerHTML =
      '<div class="kai-atama" onclick="kirikaeru(' + bangou + ')">' +
        '<div class="event-mei">' + kai.eventMei + '</div>' +
        '<div class="hizuke">' + kai.hizuke + '</div>' +
        '<div class="nokori ' + (nokori > 0 ? '' : 'ok') + '">' + nokoriMoji + '</div>' +
        '<div class="namae-list">' +
          '出演決定 ' + kai.shutsuensha.length + ' / ' + kai.hitsuyouNinzuu + ' 人<br>' +
          kai.shutsuensha.join("、") +
        '</div>' +
      '</div>' +
      nyuuryokuBubun;

    basho.appendChild(card);
  }
}

// 起動したら、まず読み込む
yomikomu();
</script>

</body>
</html>
