<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャンユニデータベース</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&display=swap" rel="stylesheet">

<style>
  html {
    color-scheme: dark;
  }
  body {
    font-family: sans-serif;
    background: #1a1a1e;
    color: #e8e8ea;
    margin: 0;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
  }
  /* 入力欄の中だけは、選べるようにしておく */
  input, textarea {
    -webkit-user-select: text;
    user-select: text;
  }
  /* 左・真ん中・右 の3つに分ける。
     左と右を同じ幅にすると、真ん中がぴったり中央になる */
  #atama {
    display: grid;
    grid-template-columns: 52px 1fr 52px;
    align-items: center;
    min-height: 48px;
  }
  #atama-hidari {
    justify-self: start;
  }
  #atama-migi {
    justify-self: end;
  }
  h1 {
    font-family: "Kiwi Maru", sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #f2f2f4;
    margin: 12px 0;
    text-align: center;
  }
  #modosu-btn {
    font-size: 18px;
    line-height: 1;
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #f2f2f4;
    color: #1a1a1e;
  }
  #settei-btn {
    font-size: 18px;
    line-height: 1;
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #f2f2f4;
    color: #1a1a1e;
  }
  .kai {
    background: #26262c;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .kai-atama {
    cursor: pointer;
  }
  /* イベント名と日付を1行にまとめたもの */
  .midashi-gyou {
    font-size: 22px;
    font-weight: bold;
    color: #f2f2f4;
    margin: 0 0 6px 0;
  }
  .nokori {
    font-size: 22px;
    font-weight: bold;
    margin: 8px 0;
  }
  .aka { color: #ff6b6b; }
  .kiiro { color: #ffc44d; }
  .midori { color: #5ddb7a; }
  .goukei {
    font-size: 14px;
    color: #a8a8b2;
  }

  .naka {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #3a3a44;
  }

  .waku-midashi {
    font-size: 14px;
    font-weight: bold;
    color: #c8c8d0;
    margin: 16px 0 8px 0;
  }
  .waku-midashi.oseru {
    background: #32323a;
    border-radius: 6px;
    padding: 5px 10px;
    margin: 10px 0 6px 0;
    font-size: 13px;
    cursor: pointer;
  }

  /* タスクのチェックボックス */
  .task-waku {
    margin-top: 10px;
  }
  .task-gyou {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1px 0;
    font-size: 14px;
    line-height: 1.35;
    color: #ccccd4;
    user-select: none;
  }
  .task-hidari {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .task-box {
    font-size: 16px;
    line-height: 1;
  }
  .task-sumi {
    color: #7a7a86;
    text-decoration: line-through;
  }
  .task-nissuu {
    font-size: 13px;
    color: #8a8a94;
    white-space: nowrap;
  }
  .task-nissuu.okure {
    color: #ff6b6b;
    font-weight: bold;
  }

  /* 出演決定と返答待ちの間の区切り線 */
  .kugiri {
    height: 1px;
    background: #3f3f4a;
    margin: 22px 0 6px 0;
  }

  .bumon-midashi {
    font-size: 17px;
    font-weight: bold;
    color: #f2f2f4;
    margin: 20px 0 4px 0;
    padding-bottom: 6px;
    border-bottom: 2px solid #55555f;
    cursor: pointer;
  }

  .band {
    background: #2e2e36;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .band-mei {
    font-size: 15px;
    font-weight: bold;
    color: #f2f2f4;
    cursor: pointer;
    user-select: none;
  }
  .band-mei-ran {
    font-size: 15px;
    font-weight: bold;
    padding: 6px;
    width: 100%;
    box-sizing: border-box;
    border: 2px solid #7a7a8a;
    border-radius: 6px;
    background: #1f1f25;
    color: #f2f2f4;
  }
  .band-naka {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #3f3f4a;
  }

  .member-gyou {
    font-size: 14px;
    color: #ccccd4;
    padding: 4px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .member-batsu {
    font-size: 14px;
    padding: 2px 10px;
    border: none;
    border-radius: 4px;
    background: #44444f;
    color: #ddddE2;
  }
  .member-nashi {
    font-size: 13px;
    color: #7a7a86;
    padding: 4px 0;
  }

  .waku-erabu {
    font-size: 14px;
    padding: 6px;
    border: 1px solid #4a4a56;
    border-radius: 6px;
    margin-top: 8px;
    width: 100%;
    box-sizing: border-box;
    background: #1f1f25;
    color: #e8e8ea;
  }

  .band-kesu-btn {
    font-size: 14px;
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: #b8433f;
    color: white;
    margin-top: 8px;
  }

  .ran {
    font-size: 16px;
    padding: 8px;
    width: 55%;
    border: 1px solid #4a4a56;
    border-radius: 6px;
    background: #1f1f25;
    color: #e8e8ea;
  }
  .btn {
    font-size: 15px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: #4d4d5c;
    color: white;
    margin-left: 6px;
  }
  .kai-kesu {
    background: none;
    border: none;
    color: #d9534f;
    font-size: 13px;
    padding: 0;
    margin-top: 18px;
    text-decoration: underline;
    display: block;
  }

  .band-tsuika {
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid #3a3a44;
  }
  .band-tsuika select {
    font-size: 13px;
    padding: 5px 8px;
    border: 1px solid #4a4a56;
    border-radius: 6px;
    width: auto;
    margin-top: 8px;
    background: #1f1f25;
    color: #a8a8b2;
  }
  .hito-tsuika {
    margin-top: 8px;
    margin-bottom: 12px;
  }
  .hito-tsuika select {
    font-size: 13px;
    padding: 5px 8px;
    border: 1px solid #4a4a56;
    border-radius: 6px;
    width: auto;
    margin-top: 8px;
    background: #1f1f25;
    color: #a8a8b2;
  }

  #joutai {
    font-size: 13px;
    color: #8a8a94;
    margin-bottom: 12px;
  }

  /* ポップアップ */
  #popup-shita {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: 10;
  }
  #popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 86%;
    max-width: 420px;
    max-height: 76vh;
    overflow-y: auto;
    background: #26262c;
    border-radius: 14px;
    padding: 16px;
    z-index: 11;
  }
  #popup-atama {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  #popup-title {
    font-size: 17px;
    font-weight: bold;
    color: #f2f2f4;
  }
  #popup-batsu {
    font-size: 18px;
    line-height: 1;
    padding: 6px 12px;
    border: none;
    border-radius: 8px;
    background: #3a3a44;
    color: #e8e8ea;
  }

  /* どこでもドアのリンクボタン */
  .link-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    padding: 14px 10px;
    border-radius: 10px;
    background: #f2f2f4;
    color: #1a1a1e;
    margin-bottom: 10px;
  }
  .link-nashi {
    font-size: 14px;
    color: #8a8a94;
    text-align: center;
    padding: 10px 0;
  }

  /* 設定の中身 */
  .settei-midashi {
    font-size: 14px;
    font-weight: bold;
    color: #c8c8d0;
    margin: 4px 0 10px 0;
  }
  .settei-gyou {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #2e2e36;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .settei-mei {
    font-size: 15px;
    color: #f2f2f4;
  }
  .settei-url {
    font-size: 11px;
    color: #8a8a94;
    word-break: break-all;
  }
  .settei-tsuika {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid #3a3a44;
  }
  .settei-tsuika input {
    font-size: 15px;
    padding: 8px;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #4a4a56;
    border-radius: 6px;
    background: #1f1f25;
    color: #e8e8ea;
    margin-bottom: 8px;
  }
  .settei-tsuika button {
    font-size: 15px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #6a5acd;
    color: white;
    width: 100%;
  }

  /* 4つのボタン（2×2） */
  #dougu {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 14px 0;
  }
  #dougu button {
    font-size: 15px;
    font-weight: bold;
    padding: 14px 8px;
    border: none;
    border-radius: 10px;
    background: #f2f2f4;
    color: #1a1a1e;
  }

  #tsuika-btn {
    font-size: 16px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #6a5acd;
    color: white;
    margin-bottom: 12px;
    width: 100%;
  }
  #tsuika-form {
    background: #26262c;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  #tsuika-form label {
    display: block;
    font-size: 13px;
    color: #9a9aa4;
    margin-top: 10px;
  }
  #tsuika-form select,
  #tsuika-form input {
    font-size: 16px;
    padding: 8px;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #4a4a56;
    border-radius: 6px;
    margin-top: 4px;
    background: #1f1f25;
    color: #e8e8ea;
  }
  #tsuika-form button {
    font-size: 16px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #4d4d5c;
    color: white;
    margin-top: 14px;
    width: 100%;
  }
</style>
</head>

<body>

<div id="atama">
  <div id="atama-hidari">
    <button id="modosu-btn" onclick="modosu()" style="display: none;">←</button>
  </div>
  <h1>キャンユニデータベース</h1>
  <div id="atama-migi">
    <button id="settei-btn" onclick="setteiWoHiraku()">⚙️</button>
  </div>
</div>

<div id="joutai">読み込み中...</div>

<div id="dougu">
  <button onclick="dokodemoDoor()">どこでもドア</button>
  <button onclick="tenpure()">テンプレート</button>
  <button onclick="shuffleBand()">シャッフルバンド</button>
  <button onclick="setHyou()">セット表</button>
</div>

<button id="tsuika-btn" onclick="formKirikae()">＋ 回を追加</button>

<div id="tsuika-form" style="display: none;">
  <label>イベント</label>
  <select id="shin-event" onchange="ninzuuJidou()">
    <option>キャンユニ</option>
    <option>新宿事変</option>
    <option>#けーおんぶ</option>
  </select>

  <label>日付</label>
  <input id="shin-hizuke" type="date">

  <label>必要人数</label>
  <input id="shin-ninzuu" type="number" value="32">

  <button onclick="kaiWoTasu()">この回を追加する</button>
</div>

<div id="ireru-basho"></div>


<!-- ポップアップ（どこでもドア / 設定 で使いまわす） -->
<div id="popup-shita" onclick="popupTojiru()"></div>

<div id="popup">
  <div id="popup-atama">
    <span id="popup-title"></span>
    <button id="popup-batsu" onclick="popupTojiru()">×</button>
  </div>
  <div id="popup-naka"></div>
</div>


<script>
const KIMATTA_NINZUU = {
  "キャンユニ": 32,
  "新宿事変": 32,
  "#けーおんぶ": 11
};

const WAKU_LIST = [
  { id: "kettei", mei: "出演決定" },
  { id: "chuu",   mei: "返答待ち" },
  { id: "yotei",  mei: "声掛け予定" }
];

// ------------------------------
// イベントごとのタスク
//   id  … データに保存される名札（変えない）
//   mei … 画面に出る名前
//   mae … イベントの何日前が締切か
// ------------------------------
const TASK_LIST = {
  "キャンユニ": [
    { id: "atsumeru", mei: "32人集める",            mae: 21 },
    { id: "ttSoufu",  mei: "タイムテーブル送付",     mae: 14 },
    { id: "ttHappyo", mei: "TT発表・セット表を依頼", mae: 7 },
    { id: "setMorau", mei: "セット表をもらう",       mae: 2 }
  ],
  "新宿事変": [
    { id: "atsumeru", mei: "32人集める",            mae: 21 },
    { id: "ttSoufu",  mei: "タイムテーブル送付",     mae: 14 },
    { id: "ttHappyo", mei: "TT発表・セット表を依頼", mae: 7 },
    { id: "setMorau", mei: "セット表をもらう",       mae: 2 }
  ],
  "#けーおんぶ": [
    { id: "enjaKettei", mei: "演者決定",           mae: 14 },
    { id: "ttKokuchi",  mei: "タイムテーブル告知", mae: 7 }
  ]
};

const KEONBU_BUMON = [
  { id: "dj", mei: "DJ", jougen: 8, kiiroKara: 6, midoriKara: 8 },
  { id: "vj", mei: "VJ", jougen: 3, kiiroKara: 2, midoriKara: 3 }
];


let kaiList = [];
let formHiraiteru = false;

// 取り消し用に、1つ前のデータを1枚だけ取っておく
let maeNoData = null;


// ------------------------------
// データを変える直前に、今の姿を覚えておく
// ------------------------------
function oboeru() {
  maeNoData = JSON.stringify(kaiList);
}


// ------------------------------
// 直前の姿に戻す
// ------------------------------
function modosu() {
  if (maeNoData === null) {
    return;
  }

  kaiList = JSON.parse(maeNoData);

  // 1枚しか持たないので、使ったら捨てる
  maeNoData = null;

  kakidasu();
  hozon();
}


// ------------------------------
// DJ / VJ を開く / 閉じる
//   （DJとVJはそれぞれ別。同時に開ける）
// ------------------------------
function bumonWoHiraku(kaiBangou, bumonId) {
  const kai = kaiList[kaiBangou];

  kai.bumonHiraki[bumonId] = !kai.bumonHiraki[bumonId];

  kakidasu();
}


// ==============================
// タスクのチェックボックス
// ==============================

// 長押しを見張るための時計（バンド名とは別に用意する）
let taskTokei = null;
let taskNagaoshiShita = false;


// 指が触れた
function taskOshiHajime(kaiBangou, taskId) {
  taskNagaoshiShita = false;

  taskTokei = setTimeout(function () {
    taskNagaoshiShita = true;
    taskWoHazusu(kaiBangou, taskId);
  }, 600);
}


// 指が離れた
function taskOshiOwari(kaiBangou, taskId) {
  clearTimeout(taskTokei);

  // 長押しになっていたら、ここでは何もしない
  if (taskNagaoshiShita) {
    taskNagaoshiShita = false;
    return;
  }

  taskWoTsukeru(kaiBangou, taskId);
}


function taskOshiChuushi() {
  clearTimeout(taskTokei);
}


// チェックを入れる（確認あり）
function taskWoTsukeru(kaiBangou, taskId) {
  const kai = kaiList[kaiBangou];

  // すでに入っているなら、何もしない（外すのは長押し）
  if (kai.taskDone[taskId] === true) {
    return;
  }

  // タスクの名前を探す
  const ichiran = TASK_LIST[kai.eventMei];
  let mei = taskId;

  for (const task of ichiran) {
    if (task.id === taskId) {
      mei = task.mei;
    }
  }

  const kotae = confirm("「" + mei + "」は終わった？");

  if (kotae === false) {
    return;
  }

  oboeru();
  kai.taskDone[taskId] = true;

  kakidasu();
  hozon();
}


// チェックを外す（長押しで呼ばれる）
function taskWoHazusu(kaiBangou, taskId) {
  const kai = kaiList[kaiBangou];

  // 入っていないなら、何もしない
  if (kai.taskDone[taskId] !== true) {
    return;
  }

  oboeru();
  kai.taskDone[taskId] = false;

  kakidasu();
  hozon();
}


// タスクの見た目を作る
function taskNoMitame(kaiBangou, kai) {
  const ichiran = TASK_LIST[kai.eventMei];

  // 知らないイベントなら、何も出さない
  if (!ichiran) {
    return "";
  }

  let zentai = '<div class="task-waku">';

  for (const task of ichiran) {
    const owatta = (kai.taskDone[task.id] === true);

    // チェックの箱
    let hako;
    let mojiClass = "";

    if (owatta) {
      hako = "☑";
      mojiClass = " task-sumi";
    } else {
      hako = "☐";
    }

    // 右側の日数（終わっていたら出さない）
    let nissuuBubun = "";

    if (!owatta) {
      const nokori = nokoriNissuu(kai.hizuke, task.mae);

      if (nokori > 0) {
        nissuuBubun = '<span class="task-nissuu">あと ' + nokori + '日</span>';
      } else if (nokori === 0) {
        nissuuBubun = '<span class="task-nissuu okure">！ 今日まで</span>';
      } else {
        nissuuBubun = '<span class="task-nissuu okure">！ ' + nokori + '日</span>';
      }
    }

    zentai = zentai +
      '<div class="task-gyou">' +
        '<div class="task-hidari' + mojiClass + '"' +
          ' onmousedown="taskOshiHajime(' + kaiBangou + ', \'' + task.id + '\')"' +
          ' onmouseup="taskOshiOwari(' + kaiBangou + ', \'' + task.id + '\')"' +
          ' onmouseleave="taskOshiChuushi()"' +
          ' ontouchstart="taskOshiHajime(' + kaiBangou + ', \'' + task.id + '\')"' +
          ' ontouchend="event.preventDefault(); taskOshiOwari(' + kaiBangou + ', \'' + task.id + '\')"' +
          ' ontouchmove="taskOshiChuushi()">' +
          '<span class="task-box">' + hako + '</span>' +
          '<span>' + task.mei + '</span>' +
        '</div>' +
        nissuuBubun +
      '</div>';
  }

  zentai = zentai + '</div>';

  return zentai;
}


// ==============================
// 設定データ（どこでもドアのリンクなど）
// ==============================

let setteiData = { linkList: [] };


// 受付から、設定をもらってくる
async function setteiWoYomu() {
  const henji = await fetch("/settei");
  const data = await henji.json();

  if (!data.linkList) {
    data.linkList = [];
  }

  setteiData = data;
}


// 受付に、設定を預ける
function setteiWoHozon() {
  fetch("/settei", {
    method: "POST",
    body: JSON.stringify(setteiData)
  });
}


// ==============================
// ポップアップ
// ==============================

function popupWoHiraku(title, nakami) {
  document.getElementById("popup-title").textContent = title;
  document.getElementById("popup-naka").innerHTML = nakami;

  document.getElementById("popup-shita").style.display = "block";
  document.getElementById("popup").style.display = "block";
}


function popupTojiru() {
  document.getElementById("popup-shita").style.display = "none";
  document.getElementById("popup").style.display = "none";
}


// ==============================
// どこでもドア
// ==============================

function dokodemoDoor() {
  let nakami = "";

  if (setteiData.linkList.length === 0) {
    nakami = '<div class="link-nashi">まだリンクがありません。<br>⚙️ から登録できます。</div>';
  } else {

// URLの頭に https:// が無ければ足す
function urlWoTotonoeru(url) {
  if (url.indexOf("http://") === 0) {
    return url;
  }
  if (url.indexOf("https://") === 0) {
    return url;
  }
  return "https://" + url;
}


function linkWoTasu() {
  const mei = document.getElementById("link-mei-ran").value.trim();
  const url = document.getElementById("link-url-ran").value.trim();

  if (mei === "" || url === "") {
    return;
  }

  setteiData.linkList.push({
    mei: mei,
    url: urlWoTotonoeru(url)
  });

  setteiWoHozon();

  // 設定の画面を作り直して、足したものを見せる
  setteiWoHiraku();
}

async function yomikomu() {
  const henji = await fetch("/api");
  const data = await henji.json();

  for (const kai of data) {
    kai.hiraiteru = false;
    if (kai.eventMei === "#けーおんぶ") {
      kai.hiraitaWaku = "dj-kettei";
    } else {
      kai.hiraitaWaku = "kettei";
    }
    kai.hiraitaBand = -1;
    kai.henshuuChuu = -1;

    // DJ / VJ が開いているか（最初は両方開いておく）
    kai.bumonHiraki = { dj: true, vj: true };

    if (!kai.bandList) {
      kai.bandList = [];
    }
    if (!kai.hitoList) {
      kai.hitoList = [];
    }
    if (!kai.taskDone) {
      kai.taskDone = {};

  kaiList = data;

  kakidasu();
}


function hozon() {
  const okuruMono = kaiList.map(function (kai) {
    return {
      eventMei: kai.eventMei,
      hizuke: kai.hizuke,
      hitsuyouNinzuu: kai.hitsuyouNinzuu,
      bandList: kai.bandList,
      hitoList: kai.hitoList,
      taskDone: kai.taskDone
    };
  });

  fetch("/api", {
    method: "POST",
    body: JSON.stringify(okuruMono)
  });
}


function wakuNoBand(kai, wakuId) {

  for (let bandBangou = 0; bandBangou < kai.bandList.length; bandBangou++) {

      atsumeta.push({ bangou: bandBangou, band: kai.bandList[bandBangou] });
    }
  }

  return atsumeta;
}


function wakuNoNinzuu(kai, wakuId) {
  let goukei = 0;

  for (const band of kai.bandList) {

      goukei = goukei + band.memberList.length;

function bumonWakuNoHito(kai, bumonId, wakuId) {

function keonbuIroWoKimeru(bumon, ninzuu) {

  return "aka";
}


// ------------------------------
// 締切まであと何日かを数える
//   プラス … まだ余裕がある
//   0     … 今日が締切
//   マイナス … 過ぎている
// ------------------------------
function nokoriNissuu(hizuke, maeNoHi) {
  // イベントの日
  const eventBi = new Date(hizuke + "T00:00:00");

  // その何日前が締切か
  const shimekiri = new Date(eventBi);
  shimekiri.setDate(shimekiri.getDate() - maeNoHi);

  // 今日（時刻は0時にそろえる）
  const kyou = new Date();
  kyou.setHours(0, 0, 0, 0);

  // 1日は 86400000 ミリ秒
  const sa = shimekiri.getTime() - kyou.getTime();

  return Math.round(sa / 86400000);
}


// ------------------------------
// 2026-09-16 を 9/16 の形にする
// ------------------------------
function hizukeWoMijikaku(hizuke) {
  // "2026-09-16" を "-" で3つに切り分ける
  const bubun = hizuke.split("-");

  if (bubun.length !== 3) {
    // 思った形でなければ、そのまま返す
    return hizuke;
  }

  // 頭の0を取る（"09" → 9）
  const tsuki = Number(bubun[1]);
  const hi = Number(bubun[2]);

  return tsuki + "/" + hi;
}


function iroWoKimeru(kai, goukei) {
  if (goukei >= kai.hitsuyouNinzuu) {
    return "midori";

  return "aka";
}

  if (nagaoshiShita) {
    nagaoshiShita = false;

  bandWoHiraku(kaiBangou, bandBangou);

// ==============================

function bandNoMitame(kaiBangou, bandBangou, band, kai) {

  // --- 名前の部分 ---
  let bandMeiBubun;

  if (kai.henshuuChuu === bandBangou) {
    // 編集中 → 入力欄
    bandMeiBubun =
      '<input class="band-mei-ran" id="bandmei-ran-' + kaiBangou + '-' + bandBangou + '"' +
        ' value="' + band.bandMei + '"' +
        ' onblur="bandMeiHenshuuOwari(' + kaiBangou + ',' + bandBangou + ', this.value)">';
  } else {
    // 普段 → 押すと開く / 長押しで名前の編集
    const hiraiteru = (kai.hiraitaBand === bandBangou);

    let yajirushi;
    if (hiraiteru) {
      yajirushi = "▼︎";
    } else {
      yajirushi = "▶︎";
    }

    bandMeiBubun =
      '<div class="band-mei"' +
        ' onmousedown="nagaoshiHajime(' + kaiBangou + ',' + bandBangou + ')"' +
        ' onmouseup="nagaoshiOwari(' + kaiBangou + ',' + bandBangou + ')"' +
        ' onmouseleave="nagaoshiChuushi()"' +
        ' ontouchstart="nagaoshiHajime(' + kaiBangou + ',' + bandBangou + ')"' +
        ' ontouchend="event.preventDefault(); nagaoshiOwari(' + kaiBangou + ',' + bandBangou + ')"' +
        ' ontouchmove="nagaoshiChuushi()">' +
        yajirushi + ' ' + band.bandMei + ' (' + band.memberList.length + '人)' +
      '</div>';
  }

  // --- 閉じているなら、名前だけ返す ---
  if (kai.hiraitaBand !== bandBangou && kai.henshuuChuu !== bandBangou) {
    return '<div class="band">' + bandMeiBubun + '</div>';
  }

  // --- 開いているときの中身 ---
  let memberBubun = "";

  if (band.memberList.length === 0) {
    memberBubun = '<div class="member-nashi">まだいません</div>';
  } else {
    for (let memberBangou = 0; memberBangou < band.memberList.length; memberBangou++) {
      memberBubun = memberBubun +
        '<div class="member-gyou">' +
          '<span>' + band.memberList[memberBangou] + '</span>' +
          '<button class="member-batsu" onclick="memberWoKesu(' + kaiBangou + ',' + bandBangou + ',' + memberBangou + ')">×</button>' +
        '</div>';
    }
  }

  // 出演決定に入っているものは、枠を動かさないのでリストを出さない
  let erabuBubun = "";

  if (band.waku !== "kettei") {
    erabuBubun = '<select class="waku-erabu" onchange="wakuWoKaeru(' + kaiBangou + ',' + bandBangou + ', this.value)">';

    for (const waku of WAKU_LIST) {
      let erabareteru = "";
      if (band.waku === waku.id) {
        erabareteru = " selected";
      }
      erabuBubun = erabuBubun + '<option value="' + waku.id + '"' + erabareteru + '>' + waku.mei + '</option>';
    }

    erabuBubun = erabuBubun + '</select>';
  }

  return '<div class="band">' +
      bandMeiBubun +
      '<div class="band-naka">' +
        memberBubun +
        '<div style="margin-top:8px;">' +
          '<input class="ran" id="member-ran-' + kaiBangou + '-' + bandBangou + '" placeholder="メンバー名">' +
          '<button class="btn" onclick="memberWoTasu(' + kaiBangou + ',' + bandBangou + ')">追加</button>' +
        '</div>' +
        erabuBubun +
        '<button class="band-kesu-btn" onclick="bandWoKesu(' + kaiBangou + ',' + bandBangou + ')">バンドを削除</button>' +
      '</div>' +
    '</div>';
}


function hitoNoMitame(kaiBangou, hitoBangou, hito) {

  let erabuBubun = "";

  if (hito.waku !== "kettei") {
    erabuBubun = '<select class="waku-erabu" onchange="hitoNoWakuWoKaeru(' + kaiBangou + ',' + hitoBangou + ', this.value)">';

    for (const waku of WAKU_LIST) {

function bandGataNoNaka(kaiBangou, kai) {
  let wakuBubun = "";

  for (const waku of WAKU_LIST) {
    const atsumeta = wakuNoBand(kai, waku.id);
    const ninzuu = wakuNoNinzuu(kai, waku.id);

    // 3つとも押して開け閉めできる（同時に開くのは1つだけ）
    const dasu = (kai.hiraitaWaku === waku.id);

    let yajirushi;
    if (dasu) {
      yajirushi = "▼︎";
    } else {
      yajirushi = "▶︎";
    }

    const midashi =
      '<div class="waku-midashi oseru" onclick="wakuWoHiraku(' + kaiBangou + ', \'' + waku.id + '\')">' +
        yajirushi + ' ' + waku.mei + '　' + atsumeta.length + 'バンド ' + ninzuu + '名' +
      '</div>';

    wakuBubun = wakuBubun + midashi;

    if (dasu) {
      for (const kumi of atsumeta) {
        wakuBubun = wakuBubun + bandNoMitame(kaiBangou, kumi.bangou, kumi.band, kai);
      }
    }

    // 出演決定を書き終えたら、区切り線を1本入れる
    if (waku.id === "kettei") {
      wakuBubun = wakuBubun + '<div class="kugiri"></div>';
    }
  }

  // バンドを足すところ（一番上に置く）
  // 枠を選ぶリスト（下に置く）
  let erabu = '<select id="band-waku-' + kaiBangou + '">';

  for (const waku of WAKU_LIST) {
    erabu = erabu + '<option value="' + waku.id + '">' + waku.mei + ' に追加</option>';
  }

  erabu = erabu + '</select>';

  // バンドを足すところ（名前が上、枠のリストが下）
  const tsuikaBubun =
    '<div class="band-tsuika">' +
      '<div>' +
        '<input class="ran" id="band-ran-' + kaiBangou + '" placeholder="バンド名">' +
        '<button class="btn" onclick="bandWoTasu(' + kaiBangou + ')">追加</button>' +
      '</div>' +
      '<div>' + erabu + '</div>' +
    '</div>';

  // 回を削除（一番下に、ただの赤文字で）
  const kesuBubun =
    '<button class="kai-kesu" onclick="kaiWoKesu(' + kaiBangou + ')">この回を削除</button>';

  return '<div class="naka">' + tsuikaBubun + wakuBubun + kesuBubun + '</div>';
}


function keonbuNoNaka(kaiBangou, kai) {
  let zentai = "";

  for (const bumon of KEONBU_BUMON) {

    // DJ / VJ が開いているか
    const bumonHiraiteru = (kai.bumonHiraki[bumon.id] === true);

    let bumonYajirushi;
    if (bumonHiraiteru) {
      bumonYajirushi = "▼︎";
    } else {
      bumonYajirushi = "▶︎";
    }

    zentai = zentai +
      '<div class="bumon-midashi" onclick="bumonWoHiraku(' + kaiBangou + ', \'' + bumon.id + '\')">' +
        bumonYajirushi + ' ' + bumon.mei +
      '</div>';

    // 閉じているなら、中身は出さずに次の部門へ
    if (!bumonHiraiteru) {
      continue;
    }

    // 人を足すところ（部門の見出しのすぐ下に置く）
    // 枠を選ぶリスト（下に置く）
    let erabu = '<select id="hito-waku-' + kaiBangou + '-' + bumon.id + '">';

    for (const waku of WAKU_LIST) {
      erabu = erabu + '<option value="' + waku.id + '">' + waku.mei + ' に追加</option>';
    }

    erabu = erabu + '</select>';

    // 人を足すところ（名前が上、枠のリストが下）
    const tsuika =
      '<div class="hito-tsuika">' +
        '<div>' +
          '<input class="ran" id="hito-ran-' + kaiBangou + '-' + bumon.id + '" placeholder="' + bumon.mei + 'の名前">' +
          '<button class="btn" onclick="hitoWoTasu(' + kaiBangou + ', \'' + bumon.id + '\')">追加</button>' +
        '</div>' +
        '<div>' + erabu + '</div>' +
      '</div>';

    zentai = zentai + tsuika;

    for (const waku of WAKU_LIST) {
      const atsumeta = bumonWakuNoHito(kai, bumon.id, waku.id);
      const kagi = bumon.id + "-" + waku.id;

      // 3つとも押して開け閉めできる（カード全体で、同時に開くのは1つだけ）
      const dasu = (kai.hiraitaWaku === kagi);

      let yajirushi;
      if (dasu) {
        yajirushi = "▼︎";
      } else {
        yajirushi = "▶︎";
      }

      const midashi =
        '<div class="waku-midashi oseru" onclick="wakuWoHiraku(' + kaiBangou + ', \'' + kagi + '\')">' +
          yajirushi + ' ' + waku.mei + '　' + atsumeta.length + '名' +
        '</div>';

      zentai = zentai + midashi;

      if (dasu) {
        if (atsumeta.length === 0) {
          zentai = zentai + '<div class="member-nashi">まだいません</div>';
        } else {
          for (const kumi of atsumeta) {
            zentai = zentai + hitoNoMitame(kaiBangou, kumi.bangou, kumi.hito);
          }
        }
      }

      // 出演決定を書き終えたら、区切り線を1本入れる
      if (waku.id === "kettei") {
        zentai = zentai + '<div class="kugiri"></div>';
      }
    }

  }

  // 回を削除（一番下に、ただの赤文字で）
  zentai = zentai +
    '<button class="kai-kesu" onclick="kaiWoKesu(' + kaiBangou + ')">この回を削除</button>';

  return '<div class="naka">' + zentai + '</div>';
}


function bandGataNoAtama(kai) {
  const ketteiNinzuu = wakuNoNinzuu(kai, "kettei");
  const nokori = kai.hitsuyouNinzuu - ketteiNinzuu;

  let nokoriMoji;
  if (nokori > 0) {
    nokoriMoji = "あと " + nokori + " 人";
  } else {
    nokoriMoji = "そろった";
  }

  const iro = iroWoKimeru(kai, ketteiNinzuu);

  return '<div class="nokori ' + iro + '">' + nokoriMoji + '</div>' +
    '<div class="goukei">出演決定 ' + ketteiNinzuu + ' / ' + kai.hitsuyouNinzuu + ' 人</div>';
}


function keonbuNoAtama(kai) {
  let nokoriBubun = "あと ";
  let ketteiGoukei = 0;

  for (const bumon of KEONBU_BUMON) {
    const kettei = bumonWakuNoNinzuu(kai, bumon.id, "kettei");
    ketteiGoukei = ketteiGoukei + kettei;

    let nokori = bumon.jougen - kettei;
    if (nokori < 0) {
      nokori = 0;
    }

    const iro = keonbuIroWoKimeru(bumon, kettei);

    nokoriBubun = nokoriBubun +
      '<span class="' + iro + '">' + bumon.mei + ' ' + nokori + '名</span>　';
  }

  return '<div class="nokori">' + nokoriBubun + '</div>' +
    '<div class="goukei">出演決定 ' + ketteiGoukei + ' / ' + keonbuGoukeiJougen() + ' 人</div>';
}


function kakidasu() {
  const basho = document.getElementById("ireru-basho");
  basho.innerHTML = "";

  for (let kaiBangou = 0; kaiBangou < kaiList.length; kaiBangou++) {
    const kai = kaiList[kaiBangou];

    const keonbu = (kai.eventMei === "#けーおんぶ");

    let atamaBubun;
    if (keonbu) {
      atamaBubun = keonbuNoAtama(kai);
    } else {
      atamaBubun = bandGataNoAtama(kai);
    }

    let nakaBubun = "";
    if (kai.hiraiteru) {
      if (keonbu) {
        nakaBubun = keonbuNoNaka(kaiBangou, kai);
      } else {
        nakaBubun = bandGataNoNaka(kaiBangou, kai);
      }
    }

    const card = document.createElement("div");
    card.className = "kai";

    card.innerHTML =
      '<div class="kai-atama" onclick="kirikaeru(' + kaiBangou + ')">' +
        '<div class="midashi-gyou">' + kai.eventMei + ' ' + hizukeWoMijikaku(kai.hizuke) + '</div>' +
        atamaBubun +
      '</div>' +
      taskNoMitame(kaiBangou, kai) +
      nakaBubun;

    basho.appendChild(card);
  }

  botanKousin();
}

// 起動したら、回のデータと設定の両方を読み込む
yomikomu();
setteiWoYomu();
</script>
