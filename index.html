<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オファー人数</title>

<style>
  body {
    font-family: sans-serif;
    background: #f4f4f6;
    margin: 0;
    padding: 16px;
  }
  h1 {
    font-size: 20px;
  }
  .kai {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .kai-atama {
    cursor: pointer;
  }
  .event-mei {
    font-size: 13px;
    color: #888;
  }
  .hizuke {
    font-size: 18px;
    font-weight: bold;
    margin: 4px 0;
  }
  .nokori {
    font-size: 22px;
    font-weight: bold;
    margin: 8px 0;
  }
  .nokori.aka {
    color: #d33;
  }
  .nokori.kiiro {
    color: #c90;
  }
  .nokori.midori {
    color: #2a2;
  }
  .goukei {
    font-size: 14px;
    color: #555;
  }

  /* 開いたときの中身 */
  .naka {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #eee;
  }

  /* 枠の見出し */
  .waku-midashi {
    font-size: 14px;
    font-weight: bold;
    color: #444;
    margin: 16px 0 8px 0;
  }
  /* 押せる見出し（声掛け中・声掛け予定） */
  .waku-midashi.oseru {
    background: #eeeef1;
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
  }

  /* バンド1つ分 */
  .band {
    background: #f7f7f9;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .band-mei {
    font-size: 15px;
    font-weight: bold;
  }

  /* メンバー1人分の行 */
  .member-gyou {
    font-size: 14px;
    color: #555;
    padding: 4px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .member-batsu {
    font-size: 14px;
    padding: 2px 10px;
    border: none;
    border-radius: 4px;
    background: #ddd;
    color: #555;
  }
  .member-nashi {
    font-size: 13px;
    color: #aaa;
    padding: 4px 0;
  }

  .waku-erabu {
    font-size: 14px;
    padding: 6px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-top: 8px;
    width: 100%;
    box-sizing: border-box;
  }

  /* バンドを削除するボタン */
  .band-kesu-btn {
    font-size: 14px;
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: #c33;
    color: white;
    margin-top: 8px;
  }

  /* 入力欄まわり */
  .ran {
    font-size: 16px;
    padding: 8px;
    width: 55%;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .btn {
    font-size: 15px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: #333;
    color: white;
    margin-left: 6px;
  }
  .kesu-btn {
    background: #c33;
    margin-top: 12px;
    margin-left: 0;
    display: block;
  }

  /* バンドを追加するところ */
  .band-tsuika {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid #eee;
  }
  .band-tsuika select {
    font-size: 15px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 8px;
  }

  #joutai {
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
  }

  /* 回を追加するところ */
  #tsuika-btn {
    font-size: 16px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    margin-bottom: 12px;
    width: 100%;
  }
  #tsuika-form {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  #tsuika-form label {
    display: block;
    font-size: 13px;
    color: #888;
    margin-top: 10px;
  }
  #tsuika-form select,
  #tsuika-form input {
    font-size: 16px;
    padding: 8px;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-top: 4px;
  }
  #tsuika-form button {
    font-size: 16px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    margin-top: 14px;
    width: 100%;
  }
</style>
</head>

<body>

<h1>オファー人数</h1>

<div id="joutai">読み込み中...</div>

<button id="tsuika-btn" onclick="formKirikae()">＋ 回を追加</button>

<div id="tsuika-form" style="display: none;">
  <label>イベント</label>
  <select id="shin-event" onchange="ninzuuJidou()">
    <option>キャンユニ</option>
    <option>新宿事変</option>
    <option>#けーおんぶ</option>
  </select>

  <label>日付</label>
  <input id="shin-hizuke" type="date">

  <label>必要人数</label>
  <input id="shin-ninzuu" type="number" value="32">

  <button onclick="kaiWoTasu()">この回を追加する</button>
</div>

<div id="ireru-basho"></div>


<script>
// ------------------------------
// イベントごとの決まった人数（テンプレート）
// ------------------------------
const KIMATTA_NINZUU = {
  "キャンユニ": 32,
  "新宿事変": 32,
  "#けーおんぶ": 8
};

// ------------------------------
// 3つの枠
// ------------------------------
const WAKU_LIST = [
  { id: "kettei", mei: "出演決定" },
  { id: "chuu",   mei: "声掛け中" },
  { id: "yotei",  mei: "声掛け予定" }
];


// ------------------------------
// データ
// ------------------------------
let kaiList = [];
let formHiraiteru = false;


// ------------------------------
// イベントを選んだら、人数を自動で入れる
// ------------------------------
function ninzuuJidou() {
  const eventMei = document.getElementById("shin-event").value;
  document.getElementById("shin-ninzuu").value = KIMATTA_NINZUU[eventMei];
}


// ------------------------------
// 受付から、データをもらってくる
// ------------------------------
async function yomikomu() {
  const henji = await fetch("/api");
  const data = await henji.json();

  for (const kai of data) {
    kai.hiraiteru = false;
    kai.hiraitaWaku = "";
  }

  kaiList = data;

  document.getElementById("joutai").textContent = "";
  kakidasu();
}


// ------------------------------
// 受付に、データを預ける
// ------------------------------
function hozon() {
  const okuruMono = kaiList.map(function (kai) {
    return {
      eventMei: kai.eventMei,
      hizuke: kai.hizuke,
      hitsuyouNinzuu: kai.hitsuyouNinzuu,
      bandList: kai.bandList
    };
  });

  fetch("/api", {
    method: "POST",
    body: JSON.stringify(okuruMono)
  });
}


// ------------------------------
// ある枠のバンドだけを集める
// ------------------------------
function wakuNoBand(kai, wakuId) {
  const atsumeta = [];

  for (let bandBangou = 0; bandBangou < kai.bandList.length; bandBangou++) {
    if (kai.bandList[bandBangou].waku === wakuId) {
      atsumeta.push({ bangou: bandBangou, band: kai.bandList[bandBangou] });
    }
  }

  return atsumeta;
}


// ------------------------------
// ある枠の、人数の合計を数える
// ------------------------------
function wakuNoNinzuu(kai, wakuId) {
  let goukei = 0;

  for (const band of kai.bandList) {
    if (band.waku === wakuId) {
      goukei = goukei + band.memberList.length;
    }
  }

  return goukei;
}


// ------------------------------
// 色を決める
// ------------------------------
function iroWoKimeru(kai, goukei) {
  if (kai.eventMei === "#けーおんぶ") {
    if (goukei >= kai.hitsuyouNinzuu) {
      return "midori";
    }
    if (goukei > 5) {
      return "kiiro";
    }
    return "aka";
  }

  if (goukei >= kai.hitsuyouNinzuu) {
    return "midori";
  }
  return "aka";
}


// ------------------------------
// 追加フォームを開く / 閉じる
// ------------------------------
function formKirikae() {
  formHiraiteru = !formHiraiteru;

  const form = document.getElementById("tsuika-form");
  if (formHiraiteru) {
    form.style.display = "block";
  } else {
    form.style.display = "none";
  }
}


// ------------------------------
// 回を1つ足す
// ------------------------------
function kaiWoTasu() {
  const eventMei = document.getElementById("shin-event").value;
  const hizuke = document.getElementById("shin-hizuke").value;
  const ninzuu = Number(document.getElementById("shin-ninzuu").value);

  if (hizuke === "") {
    return;
  }

  kaiList.push({
    eventMei: eventMei,
    hizuke: hizuke,
    hitsuyouNinzuu: ninzuu,
    bandList: [],
    hiraiteru: false,
    hiraitaWaku: ""
  });

  formKirikae();

  kakidasu();
  hozon();
}


// ------------------------------
// 回を1つ消す
// ------------------------------
function kaiWoKesu(kaiBangou) {
  const kai = kaiList[kaiBangou];

  const kotae = confirm(kai.eventMei + " " + kai.hizuke + " を削除しますか？");

  if (kotae === false) {
    return;
  }

  kaiList.splice(kaiBangou, 1);

  kakidasu();
  hozon();
}


// ------------------------------
// バンドを1つ足す
// ------------------------------
function bandWoTasu(kaiBangou) {
  const ran = document.getElementById("band-ran-" + kaiBangou);
  const wakuRan = document.getElementById("band-waku-" + kaiBangou);

  const bandMei = ran.value.trim();
  const waku = wakuRan.value;

  if (bandMei === "") {
    return;
  }

  kaiList[kaiBangou].bandList.push({
    bandMei: bandMei,
    waku: waku,
    memberList: []
  });

  // 追加した枠を開いておく（出演決定はもともと開いている）
  if (waku !== "kettei") {
    kaiList[kaiBangou].hiraitaWaku = waku;
  }

  kakidasu();
  hozon();
}


// ------------------------------
// バンドを1つ消す（確認あり）
// ------------------------------
function bandWoKesu(kaiBangou, bandBangou) {
  const band = kaiList[kaiBangou].bandList[bandBangou];

  const kotae = confirm(band.bandMei + " を削除しますか？（メンバー " + band.memberList.length + "人も消えます）");

  if (kotae === false) {
    return;
  }

  kaiList[kaiBangou].bandList.splice(bandBangou, 1);

  kakidasu();
  hozon();
}


// ------------------------------
// バンドの枠を変える
// ------------------------------
function wakuWoKaeru(kaiBangou, bandBangou, atarashiiWaku) {
  kaiList[kaiBangou].bandList[bandBangou].waku = atarashiiWaku;

  kakidasu();
  hozon();
}


// ------------------------------
// メンバーを1人足す
// ------------------------------
function memberWoTasu(kaiBangou, bandBangou) {
  const ran = document.getElementById("member-ran-" + kaiBangou + "-" + bandBangou);
  const namae = ran.value.trim();

  if (namae === "") {
    return;
  }

  kaiList[kaiBangou].bandList[bandBangou].memberList.push(namae);

  kakidasu();
  hozon();
}


// ------------------------------
// メンバーを1人消す（確認なし）
// ------------------------------
function memberWoKesu(kaiBangou, bandBangou, memberBangou) {
  kaiList[kaiBangou].bandList[bandBangou].memberList.splice(memberBangou, 1);

  kakidasu();
  hozon();
}


// ------------------------------
// カードを開く / 閉じる
// ------------------------------
function kirikaeru(kaiBangou) {
  kaiList[kaiBangou].hiraiteru = !kaiList[kaiBangou].hiraiteru;
  kakidasu();
}


// ------------------------------
// 枠を開く / 閉じる
// （同時に開けるのは1つだけ）
// ------------------------------
function wakuWoHiraku(kaiBangou, wakuId) {
  const kai = kaiList[kaiBangou];

  if (kai.hiraitaWaku === wakuId) {
    // すでに開いているものを押した → 閉じる
    kai.hiraitaWaku = "";
  } else {
    // 別のものを押した → そっちを開く（前のは自動で閉じる）
    kai.hiraitaWaku = wakuId;
  }

  kakidasu();
}


// ------------------------------
// バンド1つ分の見た目を作る
// ------------------------------
function bandNoMitame(kaiBangou, bandBangou, band) {

  // --- メンバーを1人ずつ縦に並べる ---
  let memberBubun = "";

  if (band.memberList.length === 0) {
    memberBubun = '<div class="member-nashi">まだいません</div>';
  } else {
    for (let memberBangou = 0; memberBangou < band.memberList.length; memberBangou++) {
      memberBubun = memberBubun +
        '<div class="member-gyou">' +
          '<span>' + band.memberList[memberBangou] + '</span>' +
          '<button class="member-batsu" onclick="memberWoKesu(' + kaiBangou + ',' + bandBangou + ',' + memberBangou + ')">×</button>' +
        '</div>';
    }
  }

  // --- 枠を選ぶリストを作る ---
  let erabuBubun = '<select class="waku-erabu" onchange="wakuWoKaeru(' + kaiBangou + ',' + bandBangou + ', this.value)">';

  for (const waku of WAKU_LIST) {
    let erabareteru = "";
    if (band.waku === waku.id) {
      erabareteru = " selected";
    }
    erabuBubun = erabuBubun + '<option value="' + waku.id + '"' + erabareteru + '>' + waku.mei + '</option>';
  }

  erabuBubun = erabuBubun + '</select>';

  // --- 組み立てる ---
  return '<div class="band">' +
      '<div class="band-mei">' + band.bandMei + ' (' + band.memberList.length + '人)</div>' +
      memberBubun +
      '<div style="margin-top:8px;">' +
        '<input class="ran" id="member-ran-' + kaiBangou + '-' + bandBangou + '" placeholder="メンバー名">' +
        '<button class="btn" onclick="memberWoTasu(' + kaiBangou + ',' + bandBangou + ')">追加</button>' +
      '</div>' +
      erabuBubun +
      '<button class="band-kesu-btn" onclick="bandWoKesu(' + kaiBangou + ',' + bandBangou + ')">バンドを削除</button>' +
    '</div>';
}


// ------------------------------
// 画面に書き出す
// ------------------------------
function kakidasu() {
  const basho = document.getElementById("ireru-basho");
  basho.innerHTML = "";

  for (let kaiBangou = 0; kaiBangou < kaiList.length; kaiBangou++) {
    const kai = kaiList[kaiBangou];

    const ketteiNinzuu = wakuNoNinzuu(kai, "kettei");
    const nokori = kai.hitsuyouNinzuu - ketteiNinzuu;

    let nokoriMoji;
    if (nokori > 0) {
      nokoriMoji = "あと " + nokori + " 人";
    } else {
      nokoriMoji = "そろった";
    }

    const iro = iroWoKimeru(kai, ketteiNinzuu);

    // --- 開いたときの中身を組み立てる ---
    let nakaBubun = "";

    if (kai.hiraiteru) {
      let wakuBubun = "";

      for (const waku of WAKU_LIST) {
        const atsumeta = wakuNoBand(kai, waku.id);
        const ninzuu = wakuNoNinzuu(kai, waku.id);

        // この枠の中身を出すかどうかを決める
        let dasu;
        let midashi;

        if (waku.id === "kettei") {
          // 出演決定は、いつも開いている。押せない
          dasu = true;
          midashi =
            '<div class="waku-midashi">' +
              waku.mei + '　' + atsumeta.length + 'バンド ' + ninzuu + '名' +
            '</div>';
        } else {
          // 声掛け中・声掛け予定は、押して開く
          dasu = (kai.hiraitaWaku === waku.id);

          let yajirushi;
          if (dasu) {
            yajirushi = "▼";
          } else {
            yajirushi = "▶";
          }

          midashi =
            '<div class="waku-midashi oseru" onclick="wakuWoHiraku(' + kaiBangou + ', \'' + waku.id + '\')">' +
              yajirushi + ' ' + waku.mei + '　' + atsumeta.length + 'バンド ' + ninzuu + '名' +
            '</div>';
        }

        wakuBubun = wakuBubun + midashi;

        // 開いているときだけ、バンドを書き出す
        if (dasu) {
          for (const kumi of atsumeta) {
            wakuBubun = wakuBubun + bandNoMitame(kaiBangou, kumi.bangou, kumi.band);
          }
        }
      }

      let tsuikaBubun =
        '<div class="band-tsuika">' +
          '<select id="band-waku-' + kaiBangou + '">';

      for (const waku of WAKU_LIST) {
        tsuikaBubun = tsuikaBubun + '<option value="' + waku.id + '">' + waku.mei + ' に追加</option>';
      }

      tsuikaBubun = tsuikaBubun +
          '</select>' +
          '<input class="ran" id="band-ran-' + kaiBangou + '" placeholder="バンド名">' +
          '<button class="btn" onclick="bandWoTasu(' + kaiBangou + ')">追加</button>' +
          '<button class="btn kesu-btn" onclick="kaiWoKesu(' + kaiBangou + ')">この回を削除</button>' +
        '</div>';

      nakaBubun = '<div class="naka">' + wakuBubun + tsuikaBubun + '</div>';
    }

    // --- カードを作る ---
    const card = document.createElement("div");
    card.className = "kai";

    card.innerHTML =
      '<div class="kai-atama" onclick="kirikaeru(' + kaiBangou + ')">' +
        '<div class="event-mei">' + kai.eventMei + '</div>' +
        '<div class="hizuke">' + kai.hizuke + '</div>' +
        '<div class="nokori ' + iro + '">' + nokoriMoji + '</div>' +
        '<div class="goukei">出演決定 ' + ketteiNinzuu + ' / ' + kai.hitsuyouNinzuu + ' 人</div>' +
      '</div>' +
      nakaBubun;

    basho.appendChild(card);
  }
}

yomikomu();
</script>

</body>
</html>
