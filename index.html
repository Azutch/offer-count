<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オファー人数</title>

<style>
  body {
    font-family: sans-serif;
    background: #f4f4f6;
    margin: 0;
    padding: 16px;
  }
  h1 {
    font-size: 20px;
  }
  .kai {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .kai-atama {
    cursor: pointer;
  }
  .event-mei {
    font-size: 13px;
    color: #888;
  }
  .hizuke {
    font-size: 18px;
    font-weight: bold;
    margin: 4px 0;
  }
  .nokori {
    font-size: 22px;
    font-weight: bold;
    color: #d33;
    margin: 8px 0;
  }
  .nokori.ok {
    color: #2a2;
  }
  .goukei {
    font-size: 14px;
    color: #555;
  }

  /* 開いたときの中身 */
  .naka {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #eee;
  }

  /* バンド1つ分 */
  .band {
    background: #f7f7f9;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .band-mei {
    font-size: 15px;
    font-weight: bold;
  }
  .member-list {
    font-size: 14px;
    color: #555;
    margin: 4px 0 8px 0;
  }

  /* 入力欄まわり */
  .ran {
    font-size: 16px;
    padding: 8px;
    width: 55%;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .btn {
    font-size: 15px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: #333;
    color: white;
    margin-left: 6px;
  }
  .kesu-btn {
    background: #c33;
    margin-top: 12px;
    margin-left: 0;
    display: block;
  }

  #joutai {
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
  }

  /* 回を追加するところ */
  #tsuika-btn {
    font-size: 16px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    margin-bottom: 12px;
    width: 100%;
  }
  #tsuika-form {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  #tsuika-form label {
    display: block;
    font-size: 13px;
    color: #888;
    margin-top: 10px;
  }
  #tsuika-form select,
  #tsuika-form input {
    font-size: 16px;
    padding: 8px;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-top: 4px;
  }
  #tsuika-form button {
    font-size: 16px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    margin-top: 14px;
    width: 100%;
  }
</style>
</head>

<body>

<h1>オファー人数</h1>

<div id="joutai">読み込み中...</div>

<button id="tsuika-btn" onclick="formKirikae()">＋ 回を追加</button>

<div id="tsuika-form" style="display: none;">
  <label>イベント</label>
  <select id="shin-event" onchange="ninzuuJidou()">
    <option>キャンユニ</option>
    <option>新宿事変</option>
    <option>#けーおんぶ</option>
  </select>

  <label>日付</label>
  <input id="shin-hizuke" type="date">

  <label>必要人数</label>
  <input id="shin-ninzuu" type="number" value="32">

  <button onclick="kaiWoTasu()">この回を追加する</button>
</div>

<div id="ireru-basho"></div>


<script>
// ------------------------------
// イベントごとの決まった人数（テンプレート）
// ------------------------------
const KIMATTA_NINZUU = {
  "キャンユニ": 32,
  "新宿事変": 32,
  "#けーおんぶ": 8
};


// ------------------------------
// データ
// ------------------------------
let kaiList = [];
let formHiraiteru = false;


// ------------------------------
// イベントを選んだら、人数を自動で入れる
// ------------------------------
function ninzuuJidou() {
  const eventMei = document.getElementById("shin-event").value;
  document.getElementById("shin-ninzuu").value = KIMATTA_NINZUU[eventMei];
}


// ------------------------------
// 受付から、データをもらってくる
// ------------------------------
async function yomikomu() {
  const henji = await fetch("/api");
  const data = await henji.json();

  for (const kai of data) {
    kai.hiraiteru = false;
  }

  kaiList = data;

  document.getElementById("joutai").textContent = "";
  kakidasu();
}


// ------------------------------
// 受付に、データを預ける
// ------------------------------
function hozon() {
  const okuruMono = kaiList.map(function (kai) {
    return {
      eventMei: kai.eventMei,
      hizuke: kai.hizuke,
      hitsuyouNinzuu: kai.hitsuyouNinzuu,
      bandList: kai.bandList
    };
  });

  fetch("/api", {
    method: "POST",
    body: JSON.stringify(okuruMono)
  });
}


// ------------------------------
// この回の、出演者の合計を数える
// ------------------------------
function goukeiWoKazoeru(kai) {
  let goukei = 0;

  for (const band of kai.bandList) {
    goukei = goukei + band.memberList.length;
  }

  return goukei;
}


// ------------------------------
// 追加フォームを開く / 閉じる
// ------------------------------
function formKirikae() {
  formHiraiteru = !formHiraiteru;

  const form = document.getElementById("tsuika-form");
  if (formHiraiteru) {
    form.style.display = "block";
  } else {
    form.style.display = "none";
  }
}


// ------------------------------
// 回を1つ足す
// ------------------------------
function kaiWoTasu() {
  const eventMei = document.getElementById("shin-event").value;
  const hizuke = document.getElementById("shin-hizuke").value;
  const ninzuu = Number(document.getElementById("shin-ninzuu").value);

  if (hizuke === "") {
    return;
  }

  kaiList.push({
    eventMei: eventMei,
    hizuke: hizuke,
    hitsuyouNinzuu: ninzuu,
    bandList: [],
    hiraiteru: false
  });

  formKirikae();

  kakidasu();
  hozon();
}


// ------------------------------
// 回を1つ消す
// ------------------------------
function kaiWoKesu(kaiBangou) {
  const kai = kaiList[kaiBangou];

  const kotae = confirm(kai.eventMei + " " + kai.hizuke + " を削除しますか？");

  if (kotae === false) {
    return;
  }

  kaiList.splice(kaiBangou, 1);

  kakidasu();
  hozon();
}


// ------------------------------
// バンドを1つ足す
// ------------------------------
function bandWoTasu(kaiBangou) {
  const ran = document.getElementById("band-ran-" + kaiBangou);
  const bandMei = ran.value.trim();

  if (bandMei === "") {
    return;
  }

  kaiList[kaiBangou].bandList.push({
    bandMei: bandMei,
    memberList: []
  });

  kakidasu();
  hozon();
}


// ------------------------------
// メンバーを1人足す
// ------------------------------
function memberWoTasu(kaiBangou, bandBangou) {
  const ran = document.getElementById("member-ran-" + kaiBangou + "-" + bandBangou);
  const namae = ran.value.trim();

  if (namae === "") {
    return;
  }

  kaiList[kaiBangou].bandList[bandBangou].memberList.push(namae);

  kakidasu();
  hozon();
}


// ------------------------------
// カードを開く / 閉じる
// ------------------------------
function kirikaeru(kaiBangou) {
  kaiList[kaiBangou].hiraiteru = !kaiList[kaiBangou].hiraiteru;
  kakidasu();
}


// ------------------------------
// 画面に書き出す
// ------------------------------
function kakidasu() {
  const basho = document.getElementById("ireru-basho");
  basho.innerHTML = "";

  for (let kaiBangou = 0; kaiBangou < kaiList.length; kaiBangou++) {
    const kai = kaiList[kaiBangou];

    const goukei = goukeiWoKazoeru(kai);
    const nokori = kai.hitsuyouNinzuu - goukei;

    let nokoriMoji;
    if (nokori > 0) {
      nokoriMoji = "あと " + nokori + " 人";
    } else {
      nokoriMoji = "そろった";
    }

    // --- 開いたときの中身を組み立てる ---
    let nakaBubun = "";

    if (kai.hiraiteru) {
      let bandBubun = "";

      // バンドを1つずつ書き出す
      for (let bandBangou = 0; bandBangou < kai.bandList.length; bandBangou++) {
        const band = kai.bandList[bandBangou];

        bandBubun = bandBubun +
          '<div class="band">' +
            '<div class="band-mei">' + band.bandMei + ' (' + band.memberList.length + '人)</div>' +
            '<div class="member-list">' + band.memberList.join("、") + '</div>' +
            '<input class="ran" id="member-ran-' + kaiBangou + '-' + bandBangou + '" placeholder="メンバー名">' +
            '<button class="btn" onclick="memberWoTasu(' + kaiBangou + ',' + bandBangou + ')">追加</button>' +
          '</div>';
      }

      nakaBubun =
        '<div class="naka">' +
          bandBubun +
          '<input class="ran" id="band-ran-' + kaiBangou + '" placeholder="バンド名">' +
          '<button class="btn" onclick="bandWoTasu(' + kaiBangou + ')">バンドを追加</button>' +
          '<button class="btn kesu-btn" onclick="kaiWoKesu(' + kaiBangou + ')">この回を削除</button>' +
        '</div>';
    }

    // --- カードを作る ---
    const card = document.createElement("div");
    card.className = "kai";

    card.innerHTML =
      '<div class="kai-atama" onclick="kirikaeru(' + kaiBangou + ')">' +
        '<div class="event-mei">' + kai.eventMei + '</div>' +
        '<div class="hizuke">' + kai.hizuke + '</div>' +
        '<div class="nokori ' + (nokori > 0 ? '' : 'ok') + '">' + nokoriMoji + '</div>' +
        '<div class="goukei">出演決定 ' + goukei + ' / ' + kai.hitsuyouNinzuu + ' 人</div>' +
      '</div>' +
      nakaBubun;

    basho.appendChild(card);
  }
}

yomikomu();
</script>

</body>
</html>
