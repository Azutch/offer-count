<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャンユニデータベース</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&display=swap" rel="stylesheet">

<style>
  html {
    color-scheme: dark;
  }
  body {
    font-family: sans-serif;
    background: #1a1a1e;
    color: #e8e8ea;
    margin: 0;
    padding: 16px;
  }
  #atama {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  h1 {
    font-family: "Kiwi Maru", sans-serif;
    font-size: 22px;
    font-weight: 500;
    color: #f2f2f4;
    margin: 12px 0;
  }
  #atama-botan {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #modosu-btn,
  #settei-btn {
    font-size: 18px;
    line-height: 1;
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #3a3a44;
    color: white;
  }
  .kai {
    background: #26262c;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .kai-atama {
    cursor: pointer;
  }
  .event-mei {
    font-size: 13px;
    color: #9a9aa4;
  }
  .hizuke {
    font-size: 18px;
    font-weight: bold;
    margin: 4px 0;
    color: #f2f2f4;
  }
  .nokori {
    font-size: 22px;
    font-weight: bold;
    margin: 8px 0;
  }
  .aka { color: #ff6b6b; }
  .kiiro { color: #ffc44d; }
  .midori { color: #5ddb7a; }
  .goukei {
    font-size: 14px;
    color: #a8a8b2;
  }

  .naka {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #3a3a44;
  }

  .waku-midashi {
    font-size: 14px;
    font-weight: bold;
    color: #c8c8d0;
    margin: 16px 0 8px 0;
  }
  .waku-midashi.oseru {
    background: #32323a;
    border-radius: 6px;
    padding: 5px 10px;
    margin: 10px 0 6px 0;
    font-size: 13px;
    cursor: pointer;
  }

  .bumon-midashi {
    font-size: 17px;
    font-weight: bold;
    color: #f2f2f4;
    margin: 20px 0 4px 0;
    padding-bottom: 6px;
    border-bottom: 2px solid #55555f;
  }

  .band {
    background: #2e2e36;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .band-mei {
    font-size: 15px;
    font-weight: bold;
    color: #f2f2f4;
    cursor: pointer;
    user-select: none;
  }
  .band-mei-ran {
    font-size: 15px;
    font-weight: bold;
    padding: 6px;
    width: 100%;
    box-sizing: border-box;
    border: 2px solid #7a7a8a;
    border-radius: 6px;
    background: #1f1f25;
    color: #f2f2f4;
  }
  .band-naka {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #3f3f4a;
  }

  .member-gyou {
    font-size: 14px;
    color: #ccccd4;
    padding: 4px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .member-batsu {
    font-size: 14px;
    padding: 2px 10px;
    border: none;
    border-radius: 4px;
    background: #44444f;
    color: #ddddE2;
  }
  .member-nashi {
    font-size: 13px;
    color: #7a7a86;
    padding: 4px 0;
  }

  .waku-erabu {
    font-size: 14px;
    padding: 6px;
    border: 1px solid #4a4a56;
    border-radius: 6px;
    margin-top: 8px;
    width: 100%;
    box-sizing: border-box;
    background: #1f1f25;
    color: #e8e8ea;
  }

  .band-kesu-btn {
    font-size: 14px;
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: #b8433f;
    color: white;
    margin-top: 8px;
  }

  .ran {
    font-size: 16px;
    padding: 8px;
    width: 55%;
    border: 1px solid #4a4a56;
    border-radius: 6px;
    background: #1f1f25;
    color: #e8e8ea;
  }
  .btn {
    font-size: 15px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: #4d4d5c;
    color: white;
    margin-left: 6px;
  }
  .kai-kesu {
    background: none;
    border: none;
    color: #d9534f;
    font-size: 13px;
    padding: 0;
    margin-top: 18px;
    text-decoration: underline;
    display: block;
  }

  .band-tsuika {
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid #3a3a44;
  }
  .band-tsuika select {
    font-size: 15px;
    padding: 8px;
    border: 1px solid #4a4a56;
    border-radius: 6px;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 8px;
    background: #1f1f25;
    color: #e8e8ea;
  }
  .hito-tsuika {
    margin-top: 8px;
    margin-bottom: 12px;
  }
  .hito-tsuika select {
    font-size: 15px;
    padding: 8px;
    border: 1px solid #4a4a56;
    border-radius: 6px;
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 8px;
    background: #1f1f25;
    color: #e8e8ea;
  }

  #joutai {
    font-size: 13px;
    color: #8a8a94;
    margin-bottom: 12px;
  }

  #tsuika-btn {
    font-size: 16px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #4d4d5c;
    color: white;
    margin-bottom: 12px;
    width: 100%;
  }
  #tsuika-form {
    background: #26262c;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  #tsuika-form label {
    display: block;
    font-size: 13px;
    color: #9a9aa4;
    margin-top: 10px;
  }
  #tsuika-form select,
  #tsuika-form input {
    font-size: 16px;
    padding: 8px;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #4a4a56;
    border-radius: 6px;
    margin-top: 4px;
    background: #1f1f25;
    color: #e8e8ea;
  }
  #tsuika-form button {
    font-size: 16px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #4d4d5c;
    color: white;
    margin-top: 14px;
    width: 100%;
  }
</style>
</head>

<body>

<div id="atama">
  <h1>キャンユニデータベース</h1>
  <div id="atama-botan">
    <button id="modosu-btn" onclick="modosu()" style="display: none;">🔙</button>
    <button id="settei-btn" onclick="setteiWoHiraku()">⚙️</button>
  </div>
</div>

<div id="joutai">読み込み中...</div>

<button id="tsuika-btn" onclick="formKirikae()">＋ 回を追加</button>

<div id="tsuika-form" style="display: none;">
  <label>イベント</label>
  <select id="shin-event" onchange="ninzuuJidou()">
    <option>キャンユニ</option>
    <option>新宿事変</option>
    <option>#けーおんぶ</option>
  </select>

  <label>日付</label>
  <input id="shin-hizuke" type="date">

  <label>必要人数</label>
  <input id="shin-ninzuu" type="number" value="32">

  <button onclick="kaiWoTasu()">この回を追加する</button>
</div>

<div id="ireru-basho"></div>


<script>
const KIMATTA_NINZUU = {
  "キャンユニ": 32,
  "新宿事変": 32,
  "#けーおんぶ": 11
};

const WAKU_LIST = [
  { id: "kettei", mei: "出演決定" },
  { id: "chuu",   mei: "返答待ち" },
  { id: "yotei",  mei: "声掛け予定" }
];

const KEONBU_BUMON = [
  { id: "dj", mei: "DJ", jougen: 8, kiiroKara: 6, midoriKara: 8 },
  { id: "vj", mei: "VJ", jougen: 3, kiiroKara: 2, midoriKara: 3 }
];


let kaiList = [];
let formHiraiteru = false;

// 取り消し用に、1つ前のデータを1枚だけ取っておく
let maeNoData = null;


// ------------------------------
// データを変える直前に、今の姿を覚えておく
// ------------------------------
function oboeru() {
  maeNoData = JSON.stringify(kaiList);
}


// ------------------------------
// 直前の姿に戻す
// ------------------------------
function modosu() {
  if (maeNoData === null) {
    return;
  }

  kaiList = JSON.parse(maeNoData);

  // 1枚しか持たないので、使ったら捨てる
  maeNoData = null;

  kakidasu();
  hozon();
}


// ------------------------------
// 設定（中身はこれから決める）
// ------------------------------
function setteiWoHiraku() {
  // ここに、これから設定の中身を作る
}


// ------------------------------
// 取り消しボタンを出す / 隠す
// ------------------------------
function botanKousin() {
  const botan = document.getElementById("modosu-btn");

  if (maeNoData === null) {
    botan.style.display = "none";
  } else {
    botan.style.display = "inline-block";
  }
}

// 長押しを見張るための時計
let nagaoshiTokei = null;
let nagaoshiShita = false;


function ninzuuJidou() {
  const eventMei = document.getElementById("shin-event").value;
  document.getElementById("shin-ninzuu").value = KIMATTA_NINZUU[eventMei];
}


async function yomikomu() {
  const henji = await fetch("/api");
  const data = await henji.json();

  for (const kai of data) {
    kai.hiraiteru = false;
    kai.hiraitaWaku = "";
    kai.hiraitaBand = -1;
    kai.henshuuChuu = -1;

    if (!kai.bandList) {
      kai.bandList = [];
    }
    if (!kai.hitoList) {
      kai.hitoList = [];
    }
  }

  kaiList = data;

  document.getElementById("joutai").textContent = "";
  kakidasu();
}


function hozon() {
  const okuruMono = kaiList.map(function (kai) {
    return {
      eventMei: kai.eventMei,
      hizuke: kai.hizuke,
      hitsuyouNinzuu: kai.hitsuyouNinzuu,
      bandList: kai.bandList,
      hitoList: kai.hitoList
    };
  });

  fetch("/api", {
    method: "POST",
    body: JSON.stringify(okuruMono)
  });
}


function wakuNoBand(kai, wakuId) {
  const atsumeta = [];

  for (let bandBangou = 0; bandBangou < kai.bandList.length; bandBangou++) {
    if (kai.bandList[bandBangou].waku === wakuId) {
      atsumeta.push({ bangou: bandBangou, band: kai.bandList[bandBangou] });
    }
  }

  return atsumeta;
}


function wakuNoNinzuu(kai, wakuId) {
  let goukei = 0;

  for (const band of kai.bandList) {
    if (band.waku === wakuId) {
      goukei = goukei + band.memberList.length;
    }
  }

  return goukei;
}


function keonbuGoukeiJougen() {
  let goukei = 0;

  for (const bumon of KEONBU_BUMON) {
    goukei = goukei + bumon.jougen;
  }

  return goukei;
}


function bumonWakuNoHito(kai, bumonId, wakuId) {
  const atsumeta = [];

  for (let hitoBangou = 0; hitoBangou < kai.hitoList.length; hitoBangou++) {
    const hito = kai.hitoList[hitoBangou];

    if (hito.bumon === bumonId && hito.waku === wakuId) {
      atsumeta.push({ bangou: hitoBangou, hito: hito });
    }
  }

  return atsumeta;
}


function bumonWakuNoNinzuu(kai, bumonId, wakuId) {
  return bumonWakuNoHito(kai, bumonId, wakuId).length;
}


function keonbuIroWoKimeru(bumon, ninzuu) {
  if (ninzuu >= bumon.midoriKara) {
    return "midori";
  }
  if (ninzuu >= bumon.kiiroKara) {
    return "kiiro";
  }
  return "aka";
}


function iroWoKimeru(kai, goukei) {
  if (goukei >= kai.hitsuyouNinzuu) {
    return "midori";
  }
  return "aka";
}


function formKirikae() {
  formHiraiteru = !formHiraiteru;

  const form = document.getElementById("tsuika-form");
  if (formHiraiteru) {
    form.style.display = "block";
  } else {
    form.style.display = "none";
  }
}


function kaiWoTasu() {
  oboeru();

  const eventMei = document.getElementById("shin-event").value;
  const hizuke = document.getElementById("shin-hizuke").value;
  const ninzuu = Number(document.getElementById("shin-ninzuu").value);

  if (hizuke === "") {
    return;
  }

  kaiList.push({
    eventMei: eventMei,
    hizuke: hizuke,
    hitsuyouNinzuu: ninzuu,
    bandList: [],
    hitoList: [],
    hiraiteru: false,
    hiraitaWaku: "",
    hiraitaBand: -1,
    henshuuChuu: -1
  });

  formKirikae();

  kakidasu();
  hozon();
}


function kaiWoKesu(kaiBangou) {
  const kai = kaiList[kaiBangou];

  const kotae = confirm(kai.eventMei + " " + kai.hizuke + " を削除しますか？");

  if (kotae === false) {
    return;
  }

  oboeru();
  kaiList.splice(kaiBangou, 1);

  kakidasu();
  hozon();
}


function kirikaeru(kaiBangou) {
  kaiList[kaiBangou].hiraiteru = !kaiList[kaiBangou].hiraiteru;
  kakidasu();
}


function wakuWoHiraku(kaiBangou, kagi) {
  const kai = kaiList[kaiBangou];

  if (kai.hiraitaWaku === kagi) {
    kai.hiraitaWaku = "";
  } else {
    kai.hiraitaWaku = kagi;
  }

  kakidasu();
}


// ==============================
// バンドまわり
// ==============================

function bandWoTasu(kaiBangou) {
  oboeru();

  const ran = document.getElementById("band-ran-" + kaiBangou);
  const wakuRan = document.getElementById("band-waku-" + kaiBangou);

  const bandMei = ran.value.trim();
  const waku = wakuRan.value;

  if (bandMei === "") {
    return;
  }

  kaiList[kaiBangou].bandList.push({
    bandMei: bandMei,
    waku: waku,
    memberList: []
  });

  if (waku !== "kettei") {
    kaiList[kaiBangou].hiraitaWaku = waku;
  }

  // 足したバンドを開いておく
  kaiList[kaiBangou].hiraitaBand = kaiList[kaiBangou].bandList.length - 1;

  kakidasu();
  hozon();
}


function bandWoKesu(kaiBangou, bandBangou) {
  const band = kaiList[kaiBangou].bandList[bandBangou];

  const kotae = confirm(band.bandMei + " を削除しますか？（メンバー " + band.memberList.length + "人も消えます）");

  if (kotae === false) {
    return;
  }

  oboeru();
  kaiList[kaiBangou].bandList.splice(bandBangou, 1);
  kaiList[kaiBangou].henshuuChuu = -1;
  kaiList[kaiBangou].hiraitaBand = -1;

  kakidasu();
  hozon();
}


// バンドを開く / 閉じる（同時に1つだけ）
function bandWoHiraku(kaiBangou, bandBangou) {
  const kai = kaiList[kaiBangou];

  if (kai.hiraitaBand === bandBangou) {
    kai.hiraitaBand = -1;
  } else {
    kai.hiraitaBand = bandBangou;
  }

  kakidasu();
}


// --- 長押しの見張り ---

// 指が触れた（またはマウスを押した）
function nagaoshiHajime(kaiBangou, bandBangou) {
  nagaoshiShita = false;

  nagaoshiTokei = setTimeout(function () {
    nagaoshiShita = true;
    bandMeiHenshuuKaishi(kaiBangou, bandBangou);
  }, 600);
}

// 指が離れた
function nagaoshiOwari(kaiBangou, bandBangou) {
  clearTimeout(nagaoshiTokei);

  // 長押しになっていたら、開け閉めはしない
  if (nagaoshiShita) {
    nagaoshiShita = false;
    return;
  }

  bandWoHiraku(kaiBangou, bandBangou);
}

// 指がずれて外に出た
function nagaoshiChuushi() {
  clearTimeout(nagaoshiTokei);
}


function bandMeiHenshuuKaishi(kaiBangou, bandBangou) {
  kaiList[kaiBangou].henshuuChuu = bandBangou;
  kakidasu();

  const ran = document.getElementById("bandmei-ran-" + kaiBangou + "-" + bandBangou);
  if (ran) {
    ran.focus();
    ran.select();
  }
}


function bandMeiHenshuuOwari(kaiBangou, bandBangou, atarashiiMei) {
  const namae = atarashiiMei.trim();

  if (namae !== "") {
    oboeru();
    kaiList[kaiBangou].bandList[bandBangou].bandMei = namae;
  }

  kaiList[kaiBangou].henshuuChuu = -1;

  kakidasu();
  hozon();
}


function wakuWoKaeru(kaiBangou, bandBangou, atarashiiWaku) {
  oboeru();
  kaiList[kaiBangou].bandList[bandBangou].waku = atarashiiWaku;

  kakidasu();
  hozon();
}


function memberWoTasu(kaiBangou, bandBangou) {
  const ran = document.getElementById("member-ran-" + kaiBangou + "-" + bandBangou);
  const namae = ran.value.trim();

  if (namae === "") {
    return;
  }

  oboeru();
  kaiList[kaiBangou].bandList[bandBangou].memberList.push(namae);

  kakidasu();
  hozon();
}


function memberWoKesu(kaiBangou, bandBangou, memberBangou) {
  oboeru();
  kaiList[kaiBangou].bandList[bandBangou].memberList.splice(memberBangou, 1);

  kakidasu();
  hozon();
}


// ==============================
// 人まわり（#けーおんぶ）
// ==============================

function hitoWoTasu(kaiBangou, bumonId) {
  const ran = document.getElementById("hito-ran-" + kaiBangou + "-" + bumonId);
  const wakuRan = document.getElementById("hito-waku-" + kaiBangou + "-" + bumonId);

  const namae = ran.value.trim();
  const waku = wakuRan.value;

  if (namae === "") {
    return;
  }

  oboeru();

  kaiList[kaiBangou].hitoList.push({
    namae: namae,
    bumon: bumonId,
    waku: waku
  });

  if (waku !== "kettei") {
    kaiList[kaiBangou].hiraitaWaku = bumonId + "-" + waku;
  }

  kakidasu();
  hozon();
}


function hitoWoKesu(kaiBangou, hitoBangou) {
  oboeru();
  kaiList[kaiBangou].hitoList.splice(hitoBangou, 1);

  kakidasu();
  hozon();
}


function hitoNoWakuWoKaeru(kaiBangou, hitoBangou, atarashiiWaku) {
  oboeru();
  kaiList[kaiBangou].hitoList[hitoBangou].waku = atarashiiWaku;

  kakidasu();
  hozon();
}


// ==============================
// 見た目を作る
// ==============================

function bandNoMitame(kaiBangou, bandBangou, band, kai) {

  // --- 名前の部分 ---
  let bandMeiBubun;

  if (kai.henshuuChuu === bandBangou) {
    // 編集中 → 入力欄
    bandMeiBubun =
      '<input class="band-mei-ran" id="bandmei-ran-' + kaiBangou + '-' + bandBangou + '"' +
        ' value="' + band.bandMei + '"' +
        ' onblur="bandMeiHenshuuOwari(' + kaiBangou + ',' + bandBangou + ', this.value)">';
  } else {
    // 普段 → 押すと開く / 長押しで名前の編集
    const hiraiteru = (kai.hiraitaBand === bandBangou);

    let yajirushi;
    if (hiraiteru) {
      yajirushi = "▼︎";
    } else {
      yajirushi = "▶︎";
    }

    bandMeiBubun =
      '<div class="band-mei"' +
        ' onmousedown="nagaoshiHajime(' + kaiBangou + ',' + bandBangou + ')"' +
        ' onmouseup="nagaoshiOwari(' + kaiBangou + ',' + bandBangou + ')"' +
        ' onmouseleave="nagaoshiChuushi()"' +
        ' ontouchstart="nagaoshiHajime(' + kaiBangou + ',' + bandBangou + ')"' +
        ' ontouchend="event.preventDefault(); nagaoshiOwari(' + kaiBangou + ',' + bandBangou + ')"' +
        ' ontouchmove="nagaoshiChuushi()">' +
        yajirushi + ' ' + band.bandMei + ' (' + band.memberList.length + '人)' +
      '</div>';
  }

  // --- 閉じているなら、名前だけ返す ---
  if (kai.hiraitaBand !== bandBangou && kai.henshuuChuu !== bandBangou) {
    return '<div class="band">' + bandMeiBubun + '</div>';
  }

  // --- 開いているときの中身 ---
  let memberBubun = "";

  if (band.memberList.length === 0) {
    memberBubun = '<div class="member-nashi">まだいません</div>';
  } else {
    for (let memberBangou = 0; memberBangou < band.memberList.length; memberBangou++) {
      memberBubun = memberBubun +
        '<div class="member-gyou">' +
          '<span>' + band.memberList[memberBangou] + '</span>' +
          '<button class="member-batsu" onclick="memberWoKesu(' + kaiBangou + ',' + bandBangou + ',' + memberBangou + ')">×</button>' +
        '</div>';
    }
  }

  // 出演決定に入っているものは、枠を動かさないのでリストを出さない
  let erabuBubun = "";

  if (band.waku !== "kettei") {
    erabuBubun = '<select class="waku-erabu" onchange="wakuWoKaeru(' + kaiBangou + ',' + bandBangou + ', this.value)">';

    for (const waku of WAKU_LIST) {
      let erabareteru = "";
      if (band.waku === waku.id) {
        erabareteru = " selected";
      }
      erabuBubun = erabuBubun + '<option value="' + waku.id + '"' + erabareteru + '>' + waku.mei + '</option>';
    }

    erabuBubun = erabuBubun + '</select>';
  }

  return '<div class="band">' +
      bandMeiBubun +
      '<div class="band-naka">' +
        memberBubun +
        '<div style="margin-top:8px;">' +
          '<input class="ran" id="member-ran-' + kaiBangou + '-' + bandBangou + '" placeholder="メンバー名">' +
          '<button class="btn" onclick="memberWoTasu(' + kaiBangou + ',' + bandBangou + ')">追加</button>' +
        '</div>' +
        erabuBubun +
        '<button class="band-kesu-btn" onclick="bandWoKesu(' + kaiBangou + ',' + bandBangou + ')">バンドを削除</button>' +
      '</div>' +
    '</div>';
}


function hitoNoMitame(kaiBangou, hitoBangou, hito) {
  // 出演決定に入っている人は、枠を動かさないのでリストを出さない
  let erabuBubun = "";

  if (hito.waku !== "kettei") {
    erabuBubun = '<select class="waku-erabu" onchange="hitoNoWakuWoKaeru(' + kaiBangou + ',' + hitoBangou + ', this.value)">';

    for (const waku of WAKU_LIST) {
      let erabareteru = "";
      if (hito.waku === waku.id) {
        erabareteru = " selected";
      }
      erabuBubun = erabuBubun + '<option value="' + waku.id + '"' + erabareteru + '>' + waku.mei + '</option>';
    }

    erabuBubun = erabuBubun + '</select>';
  }

  return '<div class="band">' +
      '<div class="member-gyou">' +
        '<span>' + hito.namae + '</span>' +
        '<button class="member-batsu" onclick="hitoWoKesu(' + kaiBangou + ',' + hitoBangou + ')">×</button>' +
      '</div>' +
      erabuBubun +
    '</div>';
}


function bandGataNoNaka(kaiBangou, kai) {
  let wakuBubun = "";

  for (const waku of WAKU_LIST) {
    const atsumeta = wakuNoBand(kai, waku.id);
    const ninzuu = wakuNoNinzuu(kai, waku.id);

    let dasu;
    let midashi;

    if (waku.id === "kettei") {
      dasu = true;
      midashi =
        '<div class="waku-midashi">' +
          waku.mei + '　' + atsumeta.length + 'バンド ' + ninzuu + '名' +
        '</div>';
    } else {
      dasu = (kai.hiraitaWaku === waku.id);

      let yajirushi;
      if (dasu) {
        yajirushi = "▼︎";
      } else {
        yajirushi = "▶︎";
      }

      midashi =
        '<div class="waku-midashi oseru" onclick="wakuWoHiraku(' + kaiBangou + ', \'' + waku.id + '\')">' +
          yajirushi + ' ' + waku.mei + '　' + atsumeta.length + 'バンド ' + ninzuu + '名' +
        '</div>';
    }

    wakuBubun = wakuBubun + midashi;

    if (dasu) {
      for (const kumi of atsumeta) {
        wakuBubun = wakuBubun + bandNoMitame(kaiBangou, kumi.bangou, kumi.band, kai);
      }
    }
  }

  // バンドを足すところ（一番上に置く）
  let tsuikaBubun =
    '<div class="band-tsuika">' +
      '<select id="band-waku-' + kaiBangou + '">';

  for (const waku of WAKU_LIST) {
    tsuikaBubun = tsuikaBubun + '<option value="' + waku.id + '">' + waku.mei + ' に追加</option>';
  }

  tsuikaBubun = tsuikaBubun +
      '</select>' +
      '<input class="ran" id="band-ran-' + kaiBangou + '" placeholder="バンド名">' +
      '<button class="btn" onclick="bandWoTasu(' + kaiBangou + ')">追加</button>' +
    '</div>';

  // 回を削除（一番下に、ただの赤文字で）
  const kesuBubun =
    '<button class="kai-kesu" onclick="kaiWoKesu(' + kaiBangou + ')">この回を削除</button>';

  return '<div class="naka">' + tsuikaBubun + wakuBubun + kesuBubun + '</div>';
}


function keonbuNoNaka(kaiBangou, kai) {
  let zentai = "";

  for (const bumon of KEONBU_BUMON) {

    zentai = zentai + '<div class="bumon-midashi">' + bumon.mei + '</div>';

    // 人を足すところ（部門の見出しのすぐ下に置く）
    let tsuika =
      '<div class="hito-tsuika">' +
        '<select id="hito-waku-' + kaiBangou + '-' + bumon.id + '">';

    for (const waku of WAKU_LIST) {
      tsuika = tsuika + '<option value="' + waku.id + '">' + waku.mei + ' に追加</option>';
    }

    tsuika = tsuika +
        '</select>' +
        '<input class="ran" id="hito-ran-' + kaiBangou + '-' + bumon.id + '" placeholder="' + bumon.mei + 'の名前">' +
        '<button class="btn" onclick="hitoWoTasu(' + kaiBangou + ', \'' + bumon.id + '\')">追加</button>' +
      '</div>';

    zentai = zentai + tsuika;

    for (const waku of WAKU_LIST) {
      const atsumeta = bumonWakuNoHito(kai, bumon.id, waku.id);
      const kagi = bumon.id + "-" + waku.id;

      let dasu;
      let midashi;

      if (waku.id === "kettei") {
        dasu = true;
        midashi =
          '<div class="waku-midashi">' +
            waku.mei + '　' + atsumeta.length + '名' +
          '</div>';
      } else {
        dasu = (kai.hiraitaWaku === kagi);

        let yajirushi;
        if (dasu) {
          yajirushi = "▼︎";
        } else {
          yajirushi = "▶︎";
        }

        midashi =
          '<div class="waku-midashi oseru" onclick="wakuWoHiraku(' + kaiBangou + ', \'' + kagi + '\')">' +
            yajirushi + ' ' + waku.mei + '　' + atsumeta.length + '名' +
          '</div>';
      }

      zentai = zentai + midashi;

      if (dasu) {
        if (atsumeta.length === 0) {
          zentai = zentai + '<div class="member-nashi">まだいません</div>';
        } else {
          for (const kumi of atsumeta) {
            zentai = zentai + hitoNoMitame(kaiBangou, kumi.bangou, kumi.hito);
          }
        }
      }
    }

  }

  // 回を削除（一番下に、ただの赤文字で）
  zentai = zentai +
    '<button class="kai-kesu" onclick="kaiWoKesu(' + kaiBangou + ')">この回を削除</button>';

  return '<div class="naka">' + zentai + '</div>';
}


function bandGataNoAtama(kai) {
  const ketteiNinzuu = wakuNoNinzuu(kai, "kettei");
  const nokori = kai.hitsuyouNinzuu - ketteiNinzuu;

  let nokoriMoji;
  if (nokori > 0) {
    nokoriMoji = "あと " + nokori + " 人";
  } else {
    nokoriMoji = "そろった";
  }

  const iro = iroWoKimeru(kai, ketteiNinzuu);

  return '<div class="nokori ' + iro + '">' + nokoriMoji + '</div>' +
    '<div class="goukei">出演決定 ' + ketteiNinzuu + ' / ' + kai.hitsuyouNinzuu + ' 人</div>';
}


function keonbuNoAtama(kai) {
  let nokoriBubun = "あと ";
  let ketteiGoukei = 0;

  for (const bumon of KEONBU_BUMON) {
    const kettei = bumonWakuNoNinzuu(kai, bumon.id, "kettei");
    ketteiGoukei = ketteiGoukei + kettei;

    let nokori = bumon.jougen - kettei;
    if (nokori < 0) {
      nokori = 0;
    }

    const iro = keonbuIroWoKimeru(bumon, kettei);

    nokoriBubun = nokoriBubun +
      '<span class="' + iro + '">' + bumon.mei + ' ' + nokori + '名</span>　';
  }

  return '<div class="nokori">' + nokoriBubun + '</div>' +
    '<div class="goukei">出演決定 ' + ketteiGoukei + ' / ' + keonbuGoukeiJougen() + ' 人</div>';
}


function kakidasu() {
  const basho = document.getElementById("ireru-basho");
  basho.innerHTML = "";

  for (let kaiBangou = 0; kaiBangou < kaiList.length; kaiBangou++) {
    const kai = kaiList[kaiBangou];

    const keonbu = (kai.eventMei === "#けーおんぶ");

    let atamaBubun;
    if (keonbu) {
      atamaBubun = keonbuNoAtama(kai);
    } else {
      atamaBubun = bandGataNoAtama(kai);
    }

    let nakaBubun = "";
    if (kai.hiraiteru) {
      if (keonbu) {
        nakaBubun = keonbuNoNaka(kaiBangou, kai);
      } else {
        nakaBubun = bandGataNoNaka(kaiBangou, kai);
      }
    }

    const card = document.createElement("div");
    card.className = "kai";

    card.innerHTML =
      '<div class="kai-atama" onclick="kirikaeru(' + kaiBangou + ')">' +
        '<div class="event-mei">' + kai.eventMei + '</div>' +
        '<div class="hizuke">' + kai.hizuke + '</div>' +
        atamaBubun +
      '</div>' +
      nakaBubun;

    basho.appendChild(card);
  }

  botanKousin();
}

yomikomu();
</script>
