<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャンユニデータベース</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&display=swap" rel="stylesheet">

<style>
  html {
    color-scheme: dark;
  }
  body {
    font-family: sans-serif;
    background: #1a1a1e;
    color: #e8e8ea;
    margin: 0;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
  }
  /* 入力欄の中だけは、選べるようにしておく */

    -webkit-user-select: text;
    user-select: text;
  }
  /* 左・真ん中・右 の3つに分ける。

    display: grid;
    grid-template-columns: 52px 1fr 52px;
    align-items: center;
    min-height: 48px;

  #atama-hidari {

  h1 {

  }

    line-height: 1;

  }
  .aka { color: #ff6b6b; }

  }

  .naka {

  }

  .waku-midashi {

  /* 出演決定と返答待ちの間の区切り線 */
  .kugiri {

  .band {

  .band-mei {

  .band-mei-ran {

  }
  .band-naka {

  .member-gyou {
    font-size: 14px;

  }
  .member-batsu {
    font-size: 14px;

    border-radius: 4px;

  }
  .member-nashi {

  }

  .waku-erabu {
    font-size: 14px;
    padding: 6px;
    border: 1px solid #4a4a56;
    border-radius: 6px;

  .band-kesu-btn {

  .ran {

<body>

<div id="atama">
  <div id="atama-hidari">
    <button id="modosu-btn" onclick="modosu()" style="display: none;">←</button>
  </div>
  <h1>キャンユニデータベース</h1>
  <div id="atama-migi">
    <button id="settei-btn" onclick="setteiWoHiraku()">⚙️</button>
  </div>
</div>

<div id="joutai">読み込み中...</div>

<div id="dougu">
  <button onclick="dokodemoDoor()">どこでもドア</button>
  <button onclick="tenpure()">テンプレート</button>
  <button onclick="shuffleBand()">シャッフルバンド</button>
  <button onclick="setHyou()">セット表</button>
</div>

<button id="tsuika-btn" onclick="formKirikae()">＋ 回を追加</button>

<div id="tsuika-form" style="display: none;">
  <label>イベント</label>
  <select id="shin-event" onchange="ninzuuJidou()">
    <option>キャンユニ</option>
    <option>新宿事変</option>
    <option>#けーおんぶ</option>
  </select>

  <label>日付</label>
  <input id="shin-hizuke" type="date">

  <label>必要人数</label>
  <input id="shin-ninzuu" type="number" value="32">

  <button onclick="kaiWoTasu()">この回を追加する</button>
</div>

<div id="ireru-basho"></div>


<!-- ポップアップ（どこでもドア / 設定 で使いまわす） -->
<div id="popup-shita" onclick="popupTojiru()"></div>

<div id="popup">
  <div id="popup-atama">
    <span id="popup-title"></span>
    <button id="popup-batsu" onclick="popupTojiru()">×</button>
  </div>
  <div id="popup-naka"></div>
</div>


<script>
const KIMATTA_NINZUU = {
  "キャンユニ": 32,
  "新宿事変": 32,
  "#けーおんぶ": 11
};

const WAKU_LIST = [
  { id: "kettei", mei: "出演決定" },
  { id: "chuu",   mei: "返答待ち" },
  { id: "yotei",  mei: "声掛け予定" }
];

// ------------------------------
// イベントごとのタスク
//   id  … データに保存される名札（変えない）
//   mei … 画面に出る名前
//   mae … イベントの何日前が締切か
// ------------------------------
const TASK_LIST = {
  "キャンユニ": [
    { id: "atsumeru", mei: "32人集める",            mae: 21 },
    { id: "ttSoufu",  mei: "タイムテーブル送付",     mae: 14 },
    { id: "ttHappyo", mei: "TT発表・セット表を依頼", mae: 7 },
    { id: "setMorau", mei: "セット表をもらう",       mae: 2 }
  ],
  "新宿事変": [
    { id: "atsumeru", mei: "32人集める",            mae: 21 },
    { id: "ttSoufu",  mei: "タイムテーブル送付",     mae: 14 },
    { id: "ttHappyo", mei: "TT発表・セット表を依頼", mae: 7 },
    { id: "setMorau", mei: "セット表をもらう",       mae: 2 }
  ],
  "#けーおんぶ": [
    { id: "enjaKettei", mei: "演者決定",           mae: 14 },
    { id: "ttKokuchi",  mei: "タイムテーブル告知", mae: 7 }
  ]
};

const KEONBU_BUMON = [
  { id: "dj", mei: "DJ", jougen: 8, kiiroKara: 6, midoriKara: 8 },
  { id: "vj", mei: "VJ", jougen: 3, kiiroKara: 2, midoriKara: 3 }
];


let kaiList = [];
let formHiraiteru = false;

// 取り消し用に、1つ前のデータを1枚だけ取っておく
let maeNoData = null;


// ------------------------------
// データを変える直前に、今の姿を覚えておく
// ------------------------------
function oboeru() {
  maeNoData = JSON.stringify(kaiList);
}


// ------------------------------
// 直前の姿に戻す
// ------------------------------
function modosu() {
  if (maeNoData === null) {
    return;
  }

  kaiList = JSON.parse(maeNoData);

  // 1枚しか持たないので、使ったら捨てる
  maeNoData = null;

  kakidasu();
  hozon();
}


// ------------------------------
// DJ / VJ を開く / 閉じる
//   （DJとVJはそれぞれ別。同時に開ける）
// ------------------------------
function bumonWoHiraku(kaiBangou, bumonId) {
  const kai = kaiList[kaiBangou];

  kai.bumonHiraki[bumonId] = !kai.bumonHiraki[bumonId];

  kakidasu();
}


// ==============================
// タスクのチェックボックス
// ==============================

// 長押しを見張るための時計（バンド名とは別に用意する）
let taskTokei = null;
let taskNagaoshiShita = false;


// 指が触れた
function taskOshiHajime(kaiBangou, taskId) {
  taskNagaoshiShita = false;

  taskTokei = setTimeout(function () {
    taskNagaoshiShita = true;
    taskWoHazusu(kaiBangou, taskId);
  }, 600);
}


// 指が離れた
function taskOshiOwari(kaiBangou, taskId) {
  clearTimeout(taskTokei);

  // 長押しになっていたら、ここでは何もしない
  if (taskNagaoshiShita) {
    taskNagaoshiShita = false;
    return;
  }

  taskWoTsukeru(kaiBangou, taskId);
}


function taskOshiChuushi() {
  clearTimeout(taskTokei);
}


// チェックを入れる（確認あり）
function taskWoTsukeru(kaiBangou, taskId) {
  const kai = kaiList[kaiBangou];

  // すでに入っているなら、何もしない（外すのは長押し）
  if (kai.taskDone[taskId] === true) {
    return;
  }

  // タスクの名前を探す
  const ichiran = TASK_LIST[kai.eventMei];
  let mei = taskId;

  for (const task of ichiran) {
    if (task.id === taskId) {
      mei = task.mei;
    }
  }

  const kotae = confirm("「" + mei + "」は終わった？");

  if (kotae === false) {
    return;
  }

  oboeru();
  kai.taskDone[taskId] = true;

  kakidasu();
  hozon();
}


// チェックを外す（長押しで呼ばれる）
function taskWoHazusu(kaiBangou, taskId) {
  const kai = kaiList[kaiBangou];

  // 入っていないなら、何もしない
  if (kai.taskDone[taskId] !== true) {
    return;
  }

  oboeru();
  kai.taskDone[taskId] = false;

  kakidasu();
  hozon();
}


// タスクの見た目を作る
function taskNoMitame(kaiBangou, kai) {
  const ichiran = TASK_LIST[kai.eventMei];

  // 知らないイベントなら、何も出さない
  if (!ichiran) {
    return "";
  }

  let zentai = '<div class="task-waku">';

  for (const task of ichiran) {
    const owatta = (kai.taskDone[task.id] === true);

    // チェックの箱
    let hako;
    let mojiClass = "";

    if (owatta) {
      hako = "☑";
      mojiClass = " task-sumi";
    } else {
      hako = "☐";
    }

    // 右側の日数（終わっていたら出さない）
    let nissuuBubun = "";

    if (!owatta) {
      const nokori = nokoriNissuu(kai.hizuke, task.mae);

      if (nokori > 0) {
        nissuuBubun = '<span class="task-nissuu">あと ' + nokori + '日</span>';
      } else if (nokori === 0) {
        nissuuBubun = '<span class="task-nissuu okure">！ 今日まで</span>';
      } else {
        nissuuBubun = '<span class="task-nissuu okure">！ ' + nokori + '日</span>';
      }
    }

    zentai = zentai +
      '<div class="task-gyou">' +
        '<div class="task-hidari' + mojiClass + '"' +
          ' onmousedown="taskOshiHajime(' + kaiBangou + ', \'' + task.id + '\')"' +
          ' onmouseup="taskOshiOwari(' + kaiBangou + ', \'' + task.id + '\')"' +
          ' onmouseleave="taskOshiChuushi()"' +
          ' ontouchstart="taskOshiHajime(' + kaiBangou + ', \'' + task.id + '\')"' +
          ' ontouchend="event.preventDefault(); taskOshiOwari(' + kaiBangou + ', \'' + task.id + '\')"' +
          ' ontouchmove="taskOshiChuushi()">' +
          '<span class="task-box">' + hako + '</span>' +
          '<span>' + task.mei + '</span>' +
        '</div>' +
        nissuuBubun +
      '</div>';
  }

  zentai = zentai + '</div>';

  return zentai;
}

// 1人あたりの金額
const HITORI_NO_KINGAKU = 3000;

// 支出の見込み（決まった額）
const SHISHUTSU = 40000;


// 12345 を 12,345 の形にする
function kingakuNoKaki(kazu) {
  return kazu.toLocaleString("ja-JP");
}


// 2026-09-16 を 9月16日 の形にする
function hizukeNoKaki(hizuke) {
  const bubun = hizuke.split("-");

  if (bubun.length !== 3) {
    return hizuke;
  }

  return Number(bubun[1]) + "月" + Number(bubun[2]) + "日";
}


function shuushiWoHiraku(kaiBangou) {
  const kai = kaiList[kaiBangou];

  // 出演決定の人数
  const enjaNinzuu = wakuNoNinzuu(kai, "kettei");
  const enjaKingaku = enjaNinzuu * HITORI_NO_KINGAKU;

  // 来客は、いまは数えない
  const kyakuNinzuu = 0;
  const kyakuKingaku = 0;

  const uriage = enjaKingaku + kyakuKingaku;
  const shuushi = uriage - SHISHUTSU;

  const moji =
    hizukeNoKaki(kai.hizuke) + "\n" +
    "確定収支予想\n" +
    "\n" +
    "確定演者 " + enjaNinzuu + "名 " + kingakuNoKaki(enjaKingaku) + "円\n" +
    "確定来客 " + kyakuNinzuu + "名 " + kingakuNoKaki(kyakuKingaku) + "円\n" +
    "確定売上 " + kingakuNoKaki(uriage) + "円\n" +
    "支出予想 " + kingakuNoKaki(SHISHUTSU) + "円\n" +
    "最低収支 " + kingakuNoKaki(shuushi) + "円";

  const nakami =
    '<div id="shuushi-moji">' + moji + '</div>' +
    '<button class="copy-btn" onclick="shuushiWoCopy()">コピーする</button>';

  popupWoHiraku("収支計算", nakami);
}

// ------------------------------
// 選んだ画像を、小さくしてから文字に変換する
//   写真そのままだと大きすぎるので、
//   横幅1800までに縮めて、軽くしてから預ける
// ------------------------------
function sethyouWoErabu(inputYouso) {
  const file = inputYouso.files[0];

  if (!file) {
    return;
  }

  const yomitori = new FileReader();

  yomitori.onload = function (e) {
    const gazou = new Image();

    gazou.onload = function () {
      // 縮めたあとの大きさを決める
      const saidaiHaba = 1800;

      let haba = gazou.width;
      let takasa = gazou.height;

      if (haba > saidaiHaba) {
        takasa = Math.round(takasa * (saidaiHaba / haba));
        haba = saidaiHaba;
      }

      // 見えない画用紙を用意して、そこに縮めて描く
      const canvas = document.createElement("canvas");
      canvas.width = haba;
      canvas.height = takasa;

      const fude = canvas.getContext("2d");

      // 白い紙の上に描く（透明な部分が黒くならないように）
      fude.fillStyle = "#ffffff";
      fude.fillRect(0, 0, haba, takasa);
      fude.drawImage(gazou, 0, 0, haba, takasa);

      // 文字に変換する
      sethyouGazou = canvas.toDataURL("image/jpeg", 0.85);

      sethyouWoHozon();
      setteiWoHiraku();
    };

    gazou.src = e.target.result;
  };

  yomitori.readAsDataURL(file);
}

  setteiWoHiraku();
}

// アーカイブの中身を見る（見るだけ。直せない）

function archiveWoMiru(kaiBangou) {
  const kai = kaiList[kaiBangou];

  let nakami = "";

  if (kai.eventMei === "#けーおんぶ") {
    // DJ / VJ ごとに書き出す
    for (const bumon of KEONBU_BUMON) {
      nakami = nakami + '<div class="miru-midashi">' + bumon.mei + '</div>';

      for (const waku of WAKU_LIST) {
        const atsumeta = bumonWakuNoHito(kai, bumon.id, waku.id);

        if (atsumeta.length === 0) {
          continue;
        }

        let namaeList = [];
        for (const kumi of atsumeta) {
          namaeList.push(kumi.hito.namae);
        }

        nakami = nakami +
          '<div class="miru-band">' + waku.mei + '（' + atsumeta.length + '名）</div>' +
          '<div class="miru-member">' + namaeList.join("、") + '</div>';
      }
    }
  } else {
    // 枠ごとに、バンドとメンバーを書き出す
    for (const waku of WAKU_LIST) {
      const atsumeta = wakuNoBand(kai, waku.id);

      if (atsumeta.length === 0) {
        continue;
      }

      nakami = nakami +
        '<div class="miru-midashi">' + waku.mei + '（' +
          atsumeta.length + 'バンド ' + wakuNoNinzuu(kai, waku.id) + '名）</div>';

      for (const kumi of atsumeta) {
        const band = kumi.band;

        let membersMoji = "（メンバーなし）";
        if (band.memberList.length > 0) {
          membersMoji = band.memberList.join("、");
        }

        nakami = nakami +
          '<div class="miru-band">' + band.bandMei + '</div>' +
          '<div class="miru-member">' + membersMoji + '</div>';
      }
    }
  }

  if (nakami === "") {
    nakami = '<div class="link-nashi">中身がありません</div>';
  }

  nakami = nakami +
    '<button class="modoru-btn" onclick="setteiWoHiraku()">設定に戻る</button>';

  popupWoHiraku(kai.eventMei + " " + hizukeWoMijikaku(kai.hizuke), nakami);
}

// URLの頭に https:// が無ければ足す
function urlWoTotonoeru(url) {
  if (url.indexOf("http://") === 0) {
    return url;
  }
  if (url.indexOf("https://") === 0) {
    return url;
  }
  return "https://" + url;
}


function linkWoTasu() {
  const mei = document.getElementById("link-mei-ran").value.trim();
  const url = document.getElementById("link-url-ran").value.trim();

  if (mei === "" || url === "") {
    return;
  }

  setteiData.linkList.push({
    mei: mei,
    url: urlWoTotonoeru(url)
  });

  setteiWoHozon();

  // 設定の画面を作り直して、足したものを見せる
  setteiWoHiraku();
}


function linkWoKesu(bangou) {
  const link = setteiData.linkList[bangou];

  const kotae = confirm(link.mei + " を削除しますか？");

  if (kotae === false) {
    return;
  }

  setteiData.linkList.splice(bangou, 1);

  setteiWoHozon();
  setteiWoHiraku();
}

async function yomikomu() {
  const henji = await fetch("/api");
  const data = await henji.json();

  for (const kai of data) {
    kai.hiraiteru = false;
    if (kai.eventMei === "#けーおんぶ") {
      kai.hiraitaWaku = "dj-kettei";
    } else {
      kai.hiraitaWaku = "kettei";
    }
    kai.hiraitaBand = -1;
    kai.henshuuChuu = -1;

    // DJ / VJ が開いているか（最初は両方開いておく）
    kai.bumonHiraki = { dj: true, vj: true };

    if (!kai.bandList) {
      kai.bandList = [];
    }
    if (!kai.hitoList) {
      kai.hitoList = [];
    }
    if (!kai.taskDone) {
      kai.taskDone = {};
    }
    if (kai.teDeModosita !== true) {
      kai.teDeModosita = false;
    }
  }

  kaiList = data;

  document.getElementById("joutai").textContent = "";
  kakidasu();
}


function hozon() {
  const okuruMono = kaiList.map(function (kai) {
    return {
      eventMei: kai.eventMei,
      hizuke: kai.hizuke,
      hitsuyouNinzuu: kai.hitsuyouNinzuu,
      bandList: kai.bandList,
      hitoList: kai.hitoList,
      taskDone: kai.taskDone,
      teDeModosita: kai.teDeModosita
    };
  });

  fetch("/api", {
    method: "POST",
    body: JSON.stringify(okuruMono)
  });
}


function wakuNoBand(kai, wakuId) {
  const atsumeta = [];

  for (let bandBangou = 0; bandBangou < kai.bandList.length; bandBangou++) {
    if (kai.bandList[bandBangou].waku === wakuId) {
      atsumeta.push({ bangou: bandBangou, band: kai.bandList[bandBangou] });
    }
  }

  return atsumeta;
}


function wakuNoNinzuu(kai, wakuId) {
  let goukei = 0;

  for (const band of kai.bandList) {
    if (band.waku === wakuId) {
      goukei = goukei + band.memberList.length;
    }
  }

  return goukei;
}


function keonbuGoukeiJougen() {
  let goukei = 0;

  for (const bumon of KEONBU_BUMON) {
    goukei = goukei + bumon.jougen;
  }

  return goukei;
}


function bumonWakuNoHito(kai, bumonId, wakuId) {
  const atsumeta = [];

  for (let hitoBangou = 0; hitoBangou < kai.hitoList.length; hitoBangou++) {
    const hito = kai.hitoList[hitoBangou];

    if (hito.bumon === bumonId && hito.waku === wakuId) {
      atsumeta.push({ bangou: hitoBangou, hito: hito });
    }
  }

  return atsumeta;
}


function bumonWakuNoNinzuu(kai, bumonId, wakuId) {
  return bumonWakuNoHito(kai, bumonId, wakuId).length;
}


function keonbuIroWoKimeru(bumon, ninzuu) {
  if (ninzuu >= bumon.midoriKara) {
    return "midori";
  }
  if (ninzuu >= bumon.kiiroKara) {
    return "kiiro";
  }
  return "aka";
}


// ------------------------------
// この回はアーカイブ行きか？
//   イベントの日を過ぎたら（翌日から）アーカイブ
//   手で戻したものは、ずっと一覧に残す
// ------------------------------
function waArchive(kai) {
  if (kai.teDeModosita === true) {
    return false;
  }

  const eventBi = new Date(kai.hizuke + "T00:00:00");

  const kyou = new Date();
  kyou.setHours(0, 0, 0, 0);

  return eventBi.getTime() < kyou.getTime();
}


// ------------------------------
// 締切まであと何日かを数える
//   プラス … まだ余裕がある
//   0     … 今日が締切
//   マイナス … 過ぎている
// ------------------------------
function nokoriNissuu(hizuke, maeNoHi) {
  // イベントの日
  const eventBi = new Date(hizuke + "T00:00:00");

  // その何日前が締切か
  const shimekiri = new Date(eventBi);
  shimekiri.setDate(shimekiri.getDate() - maeNoHi);

  // 今日（時刻は0時にそろえる）
  const kyou = new Date();
  kyou.setHours(0, 0, 0, 0);

  // 1日は 86400000 ミリ秒
  const sa = shimekiri.getTime() - kyou.getTime();

  return Math.round(sa / 86400000);
}


// ------------------------------
// 2026-09-16 を 9/16 の形にする
// ------------------------------
function hizukeWoMijikaku(hizuke) {
  // "2026-09-16" を "-" で3つに切り分ける
  const bubun = hizuke.split("-");

  if (bubun.length !== 3) {
    // 思った形でなければ、そのまま返す
    return hizuke;
  }

  // 頭の0を取る（"09" → 9）
  const tsuki = Number(bubun[1]);
  const hi = Number(bubun[2]);

  return tsuki + "/" + hi;
}


function iroWoKimeru(kai, goukei) {
  if (goukei >= kai.hitsuyouNinzuu) {
    return "midori";
  }
  return "aka";
}


function formKirikae() {
  formHiraiteru = !formHiraiteru;

  const form = document.getElementById("tsuika-form");
  if (formHiraiteru) {
    form.style.display = "block";
  } else {
    form.style.display = "none";
  }
}


function kaiWoTasu() {
  oboeru();

  const eventMei = document.getElementById("shin-event").value;
  const hizuke = document.getElementById("shin-hizuke").value;
  const ninzuu = Number(document.getElementById("shin-ninzuu").value);

  if (hizuke === "") {
    return;
  }

  // 最初に開いておく枠（けーおんぶだけ合言葉が違う）
  let saishoNoWaku = "kettei";
  if (eventMei === "#けーおんぶ") {
    saishoNoWaku = "dj-kettei";
  }

  kaiList.push({
    eventMei: eventMei,
    hizuke: hizuke,
    hitsuyouNinzuu: ninzuu,
    bandList: [],
    hitoList: [],
    taskDone: {},
    teDeModosita: false,
    hiraiteru: false,
    hiraitaWaku: saishoNoWaku,
    hiraitaBand: -1,
    henshuuChuu: -1,
    bumonHiraki: { dj: true, vj: true }
  });

  formKirikae();

  kakidasu();
  hozon();
}


function kaiWoKesu(kaiBangou) {
  const kai = kaiList[kaiBangou];

  const kotae = confirm(kai.eventMei + " " + kai.hizuke + " を削除しますか？");

  if (kotae === false) {
    return;
  }

  oboeru();
  kaiList.splice(kaiBangou, 1);

  kakidasu();
  hozon();
}


function kirikaeru(kaiBangou) {
  kaiList[kaiBangou].hiraiteru = !kaiList[kaiBangou].hiraiteru;
  kakidasu();
}


function wakuWoHiraku(kaiBangou, kagi) {
  const kai = kaiList[kaiBangou];

  if (kai.hiraitaWaku === kagi) {
    kai.hiraitaWaku = "";
  } else {
    kai.hiraitaWaku = kagi;
  }

  kakidasu();
}

// バンドまわり
// ==============================

function bandWoTasu(kaiBangou) {
  oboeru();

  const ran = document.getElementById("band-ran-" + kaiBangou);
  const wakuRan = document.getElementById("band-waku-" + kaiBangou);

  const bandMei = ran.value.trim();
  const waku = wakuRan.value;

  if (bandMei === "") {
    return;
  }

  kaiList[kaiBangou].bandList.push({
    bandMei: bandMei,
    waku: waku,
    memberList: []
  });

  if (waku !== "kettei") {
    kaiList[kaiBangou].hiraitaWaku = waku;
  }

  // 足したバンドを開いておく
  kaiList[kaiBangou].hiraitaBand = kaiList[kaiBangou].bandList.length - 1;

  kakidasu();
  hozon();
}


function bandWoKesu(kaiBangou, bandBangou) {
  const band = kaiList[kaiBangou].bandList[bandBangou];

  const kotae = confirm(band.bandMei + " を削除しますか？（メンバー " + band.memberList.length + "人も消えます）");

  if (kotae === false) {
    return;
  }

  oboeru();
  kaiList[kaiBangou].bandList.splice(bandBangou, 1);
  kaiList[kaiBangou].henshuuChuu = -1;
  kaiList[kaiBangou].hiraitaBand = -1;

  kakidasu();
  hozon();
}


// バンドを開く / 閉じる（同時に1つだけ）
function bandWoHiraku(kaiBangou, bandBangou) {
  const kai = kaiList[kaiBangou];

  if (kai.hiraitaBand === bandBangou) {
    kai.hiraitaBand = -1;
  } else {
    kai.hiraitaBand = bandBangou;
  }

  kakidasu();
}


// --- 長押しの見張り ---

// 指が触れた（またはマウスを押した）
function nagaoshiHajime(kaiBangou, bandBangou) {
  nagaoshiShita = false;

  nagaoshiTokei = setTimeout(function () {
    nagaoshiShita = true;
    bandMeiHenshuuKaishi(kaiBangou, bandBangou);
  }, 600);
}

// 指が離れた
function nagaoshiOwari(kaiBangou, bandBangou) {
  clearTimeout(nagaoshiTokei);

  // 長押しになっていたら、開け閉めはしない
  if (nagaoshiShita) {
    nagaoshiShita = false;
    return;
  }

  bandWoHiraku(kaiBangou, bandBangou);
}

// 指がずれて外に出た
function nagaoshiChuushi() {
  clearTimeout(nagaoshiTokei);
}


function bandMeiHenshuuKaishi(kaiBangou, bandBangou) {
  kaiList[kaiBangou].henshuuChuu = bandBangou;
  kakidasu();

  const ran = document.getElementById("bandmei-ran-" + kaiBangou + "-" + bandBangou);
  if (ran) {
    ran.focus();
    ran.select();
  }
}


function bandMeiHenshuuOwari(kaiBangou, bandBangou, atarashiiMei) {

    kaiList[kaiBangou].bandList[bandBangou].bandMei = namae;

  kaiList[kaiBangou].henshuuChuu = -1;

  kakidasu();
  hozon();
}

// ==============================
// 見た目を作る
// ==============================

function bandNoMitame(kaiBangou, bandBangou, band, kai) {

  // --- 名前の部分 ---
  let bandMeiBubun;

  if (kai.henshuuChuu === bandBangou) {
    // 編集中 → 入力欄
    bandMeiBubun =
      '<input class="band-mei-ran" id="bandmei-ran-' + kaiBangou + '-' + bandBangou + '"' +
        ' value="' + band.bandMei + '"' +
        ' onblur="bandMeiHenshuuOwari(' + kaiBangou + ',' + bandBangou + ', this.value)">';
  } else {
    // 普段 → 押すと開く / 長押しで名前の編集
    const hiraiteru = (kai.hiraitaBand === bandBangou);

    let yajirushi;
    if (hiraiteru) {
      yajirushi = "▼︎";
    } else {
      yajirushi = "▶︎";
    }

    bandMeiBubun =
      '<div class="band-mei"' +
        ' onmousedown="nagaoshiHajime(' + kaiBangou + ',' + bandBangou + ')"' +
        ' onmouseup="nagaoshiOwari(' + kaiBangou + ',' + bandBangou + ')"' +
        ' onmouseleave="nagaoshiChuushi()"' +
        ' ontouchstart="nagaoshiHajime(' + kaiBangou + ',' + bandBangou + ')"' +
        ' ontouchend="event.preventDefault(); nagaoshiOwari(' + kaiBangou + ',' + bandBangou + ')"' +
        ' ontouchmove="nagaoshiChuushi()">' +
        yajirushi + ' ' + band.bandMei + ' (' + band.memberList.length + '人)' +
      '</div>';
  }

  // --- 閉じているなら、名前だけ返す ---
  if (kai.hiraitaBand !== bandBangou && kai.henshuuChuu !== bandBangou) {
    return '<div class="band">' + bandMeiBubun + '</div>';
  }

  // --- 開いているときの中身 ---
  let memberBubun = "";

  if (band.memberList.length === 0) {
    memberBubun = '<div class="member-nashi">まだいません</div>';
  } else {
    for (let memberBangou = 0; memberBangou < band.memberList.length; memberBangou++) {
      memberBubun = memberBubun +
        '<div class="member-gyou">' +
          '<span>' + band.memberList[memberBangou] + '</span>' +
          '<button class="member-batsu" onclick="memberWoKesu(' + kaiBangou + ',' + bandBangou + ',' + memberBangou + ')">×</button>' +
        '</div>';
    }
  }

  // 出演決定に入っているものは、枠を動かさないのでリストを出さない
  let erabuBubun = "";

  if (band.waku !== "kettei") {
    erabuBubun = '<select class="waku-erabu" onchange="wakuWoKaeru(' + kaiBangou + ',' + bandBangou + ', this.value)">';

    for (const waku of WAKU_LIST) {
      let erabareteru = "";
      if (band.waku === waku.id) {
        erabareteru = " selected";
      }
      erabuBubun = erabuBubun + '<option value="' + waku.id + '"' + erabareteru + '>' + waku.mei + '</option>';
    }

    erabuBubun = erabuBubun + '</select>';
  }

  return '<div class="band">' +
      bandMeiBubun +
      '<div class="band-naka">' +
        memberBubun +
        '<div style="margin-top:8px;">' +
          '<input class="ran" id="member-ran-' + kaiBangou + '-' + bandBangou + '" placeholder="メンバー名">' +
          '<button class="btn" onclick="memberWoTasu(' + kaiBangou + ',' + bandBangou + ')">追加</button>' +
        '</div>' +
        erabuBubun +
        '<button class="band-kesu-btn" onclick="bandWoKesu(' + kaiBangou + ',' + bandBangou + ')">バンドを削除</button>' +
      '</div>' +
    '</div>';
}


function hitoNoMitame(kaiBangou, hitoBangou, hito) {
  // 出演決定に入っている人は、枠を動かさないのでリストを出さない
  let erabuBubun = "";

  if (hito.waku !== "kettei") {
    erabuBubun = '<select class="waku-erabu" onchange="hitoNoWakuWoKaeru(' + kaiBangou + ',' + hitoBangou + ', this.value)">';

    for (const waku of WAKU_LIST) {
      let erabareteru = "";
      if (hito.waku === waku.id) {
        erabareteru = " selected";
      }
      erabuBubun = erabuBubun + '<option value="' + waku.id + '"' + erabareteru + '>' + waku.mei + '</option>';
    }

    erabuBubun = erabuBubun + '</select>';
  }

  return '<div class="band">' +
      '<div class="member-gyou">' +
        '<span>' + hito.namae + '</span>' +
        '<button class="member-batsu" onclick="hitoWoKesu(' + kaiBangou + ',' + hitoBangou + ')">×</button>' +
      '</div>' +
      erabuBubun +
    '</div>';
}


function bandGataNoNaka(kaiBangou, kai) {
  let wakuBubun = "";

  for (const waku of WAKU_LIST) {
    const atsumeta = wakuNoBand(kai, waku.id);
    const ninzuu = wakuNoNinzuu(kai, waku.id);

    // 3つとも押して開け閉めできる（同時に開くのは1つだけ）
    const dasu = (kai.hiraitaWaku === waku.id);

    let yajirushi;
    if (dasu) {
      yajirushi = "▼︎";
    } else {
      yajirushi = "▶︎";
    }

    const midashi =
      '<div class="waku-midashi oseru" onclick="wakuWoHiraku(' + kaiBangou + ', \'' + waku.id + '\')">' +
        yajirushi + ' ' + waku.mei + '　' + atsumeta.length + 'バンド ' + ninzuu + '名' +
      '</div>';

    wakuBubun = wakuBubun + midashi;

    if (dasu) {
      for (const kumi of atsumeta) {
        wakuBubun = wakuBubun + bandNoMitame(kaiBangou, kumi.bangou, kumi.band, kai);
      }
    }

    // 出演決定を書き終えたら、区切り線を1本入れる
    if (waku.id === "kettei") {
      wakuBubun = wakuBubun + '<div class="kugiri"></div>';
    }
  }

  // バンドを足すところ（一番上に置く）
  // 枠を選ぶリスト（下に置く）
  let erabu = '<select id="band-waku-' + kaiBangou + '">';

  for (const waku of WAKU_LIST) {
    erabu = erabu + '<option value="' + waku.id + '">' + waku.mei + ' に追加</option>';
  }

  erabu = erabu + '</select>';

  // バンドを足すところ（名前が上、枠のリストが下）
  const tsuikaBubun =
    '<div class="band-tsuika">' +
      '<div>' +
        '<input class="ran" id="band-ran-' + kaiBangou + '" placeholder="バンド名">' +
        '<button class="btn" onclick="bandWoTasu(' + kaiBangou + ')">追加</button>' +
      '</div>' +
      '<div>' + erabu + '</div>' +
    '</div>';

  // 回を削除（一番下に、ただの赤文字で）
  const kesuBubun =
    '<button class="kai-kesu" onclick="kaiWoKesu(' + kaiBangou + ')">この回を削除</button>';

  return '<div class="naka">' + tsuikaBubun + wakuBubun + kesuBubun + '</div>';
}


function keonbuNoNaka(kaiBangou, kai) {
  let zentai = "";

  for (const bumon of KEONBU_BUMON) {

    // DJ / VJ が開いているか
    const bumonHiraiteru = (kai.bumonHiraki[bumon.id] === true);

    let bumonYajirushi;
    if (bumonHiraiteru) {
      bumonYajirushi = "▼︎";
    } else {
      bumonYajirushi = "▶︎";
    }

    zentai = zentai +
      '<div class="bumon-midashi" onclick="bumonWoHiraku(' + kaiBangou + ', \'' + bumon.id + '\')">' +
        bumonYajirushi + ' ' + bumon.mei +
      '</div>';

    // 閉じているなら、中身は出さずに次の部門へ
    if (!bumonHiraiteru) {
      continue;
    }

    // 人を足すところ（部門の見出しのすぐ下に置く）
    // 枠を選ぶリスト（下に置く）
    let erabu = '<select id="hito-waku-' + kaiBangou + '-' + bumon.id + '">';

    for (const waku of WAKU_LIST) {
      erabu = erabu + '<option value="' + waku.id + '">' + waku.mei + ' に追加</option>';
    }

    erabu = erabu + '</select>';

    // 人を足すところ（名前が上、枠のリストが下）
    const tsuika =
      '<div class="hito-tsuika">' +
        '<div>' +
          '<input class="ran" id="hito-ran-' + kaiBangou + '-' + bumon.id + '" placeholder="' + bumon.mei + 'の名前">' +
          '<button class="btn" onclick="hitoWoTasu(' + kaiBangou + ', \'' + bumon.id + '\')">追加</button>' +
        '</div>' +
        '<div>' + erabu + '</div>' +
      '</div>';

    zentai = zentai + tsuika;

    for (const waku of WAKU_LIST) {
      const atsumeta = bumonWakuNoHito(kai, bumon.id, waku.id);
      const kagi = bumon.id + "-" + waku.id;

      // 3つとも押して開け閉めできる（カード全体で、同時に開くのは1つだけ）
      const dasu = (kai.hiraitaWaku === kagi);

      let yajirushi;
      if (dasu) {
        yajirushi = "▼︎";
      } else {
        yajirushi = "▶︎";
      }

      const midashi =
        '<div class="waku-midashi oseru" onclick="wakuWoHiraku(' + kaiBangou + ', \'' + kagi + '\')">' +
          yajirushi + ' ' + waku.mei + '　' + atsumeta.length + '名' +
        '</div>';

      zentai = zentai + midashi;

      if (dasu) {
        if (atsumeta.length === 0) {
          zentai = zentai + '<div class="member-nashi">まだいません</div>';
        } else {
          for (const kumi of atsumeta) {
            zentai = zentai + hitoNoMitame(kaiBangou, kumi.bangou, kumi.hito);
          }
        }
      }

      // 出演決定を書き終えたら、区切り線を1本入れる
      if (waku.id === "kettei") {
        zentai = zentai + '<div class="kugiri"></div>';
      }
    }

  }

  // 回を削除（一番下に、ただの赤文字で）
  zentai = zentai +
    '<button class="kai-kesu" onclick="kaiWoKesu(' + kaiBangou + ')">この回を削除</button>';

  return '<div class="naka">' + zentai + '</div>';
}


function bandGataNoAtama(kai) {
  const ketteiNinzuu = wakuNoNinzuu(kai, "kettei");
  const nokori = kai.hitsuyouNinzuu - ketteiNinzuu;

  let nokoriMoji;
  if (nokori > 0) {
    nokoriMoji = "あと " + nokori + " 人";
  } else {
    nokoriMoji = "そろった";
  }

  const iro = iroWoKimeru(kai, ketteiNinzuu);

  return '<div class="nokori ' + iro + '">' + nokoriMoji + '</div>' +
    '<div class="goukei">出演決定 ' + ketteiNinzuu + ' / ' + kai.hitsuyouNinzuu + ' 人</div>';
}


function keonbuNoAtama(kai) {
  let nokoriBubun = "あと ";
  let ketteiGoukei = 0;

  for (const bumon of KEONBU_BUMON) {
    const kettei = bumonWakuNoNinzuu(kai, bumon.id, "kettei");
    ketteiGoukei = ketteiGoukei + kettei;

    let nokori = bumon.jougen - kettei;
    if (nokori < 0) {
      nokori = 0;
    }

    const iro = keonbuIroWoKimeru(bumon, kettei);

    nokoriBubun = nokoriBubun +
      '<span class="' + iro + '">' + bumon.mei + ' ' + nokori + '名</span>　';
  }

  return '<div class="nokori">' + nokoriBubun + '</div>' +
    '<div class="goukei">出演決定 ' + ketteiGoukei + ' / ' + keonbuGoukeiJougen() + ' 人</div>';
}


function kakidasu() {
  const basho = document.getElementById("ireru-basho");
  basho.innerHTML = "";

  for (let kaiBangou = 0; kaiBangou < kaiList.length; kaiBangou++) {
    const kai = kaiList[kaiBangou];

    // アーカイブ行きのものは、一覧に出さない
    if (waArchive(kai)) {
      continue;
    }

    const keonbu = (kai.eventMei === "#けーおんぶ");

    let atamaBubun;
    if (keonbu) {
      atamaBubun = keonbuNoAtama(kai);
    } else {
      atamaBubun = bandGataNoAtama(kai);
    }

    let nakaBubun = "";
    if (kai.hiraiteru) {
      if (keonbu) {
        nakaBubun = keonbuNoNaka(kaiBangou, kai);
      } else {
        nakaBubun = bandGataNoNaka(kaiBangou, kai);
      }
    }

    // 収支計算のボタン（けーおんぶには出さない）
    let shuushiBotan = "";
    if (!keonbu) {
      shuushiBotan =
        '<button class="shuushi-btn" onclick="event.stopPropagation(); shuushiWoHiraku(' + kaiBangou + ')">収支</button>';
    }

    const card = document.createElement("div");
    card.className = "kai";

    card.innerHTML =
      '<div class="kai-atama" onclick="kirikaeru(' + kaiBangou + ')">' +
        '<div class="midashi-waku">' +
          '<div class="midashi-gyou">' + kai.eventMei + ' ' + hizukeWoMijikaku(kai.hizuke) + '</div>' +
          shuushiBotan +
        '</div>' +
        atamaBubun +
      '</div>' +
      taskNoMitame(kaiBangou, kai) +
      nakaBubun;

    basho.appendChild(card);
  }

  botanKousin();
}

// 起動したら、回のデータと設定の両方を読み込む
yomikomu();
setteiWoYomu();
sethyouWoYomu();
</script>
