<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オファー人数</title>

<style>
  body {
    font-family: sans-serif;
    background: #f4f4f6;
    margin: 0;
    padding: 16px;
  }
  h1 {
    font-size: 20px;
  }
  .kai {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .kai-atama {
    cursor: pointer;
  }
  .event-mei {
    font-size: 13px;
    color: #888;
  }
  .hizuke {
    font-size: 18px;
    font-weight: bold;
    margin: 4px 0;
  }
  .nokori {
    font-size: 22px;
    font-weight: bold;
    color: #d33;
    margin: 8px 0;
  }
  .nokori.ok {
    color: #2a2;
  }
  .namae-list {
    font-size: 14px;
    color: #555;
  }
  .nyuuryoku {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #eee;
  }
  .nyuuryoku input {
    font-size: 16px;
    padding: 8px;
    width: 60%;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .nyuuryoku button {
    font-size: 16px;
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: #333;
    color: white;
    margin-left: 6px;
  }
</style>
</head>

<body>

<h1>オファー人数</h1>

<!-- ここが空っぽの箱。この中に回が書き出される -->
<div id="ireru-basho"></div>


<script>
// ------------------------------
// データ
// ------------------------------
let kaiList = [
  {
    eventMei: "バンドイベント",
    hizuke: "2026-09-12",
    hitsuyouNinzuu: 5,
    shutsuensha: ["山田", "佐藤"],
    hiraiteru: false          // 入力欄が開いているかどうか
  },
  {
    eventMei: "DJイベント",
    hizuke: "2026-10-03",
    hitsuyouNinzuu: 4,
    shutsuensha: ["田中", "鈴木", "高橋", "伊藤"],
    hiraiteru: false
  }
];


// ------------------------------
// 開く / 閉じるを切り替える
// ------------------------------
function kirikaeru(bangou) {
  kaiList[bangou].hiraiteru = !kaiList[bangou].hiraiteru;
  kakidasu();
}


// ------------------------------
// 名前を1つ足す
// ------------------------------
function namaeWoTasu(bangou) {
  // 入力欄を取ってくる
  const ran = document.getElementById("namae-ran-" + bangou);
  const namae = ran.value.trim();

  // 空っぽなら何もしない
  if (namae === "") {
    return;
  }

  // リストに足す
  kaiList[bangou].shutsuensha.push(namae);

  // 画面を書き直す
  kakidasu();
}


// ------------------------------
// 画面に書き出す
// ------------------------------
function kakidasu() {
  const basho = document.getElementById("ireru-basho");
  basho.innerHTML = "";

  // 何番目かを数えながら、1件ずつ取り出す
  for (let bangou = 0; bangou < kaiList.length; bangou++) {
    const kai = kaiList[bangou];

    // あと何人か計算する
    const nokori = kai.hitsuyouNinzuu - kai.shutsuensha.length;

    let nokoriMoji;
    if (nokori > 0) {
      nokoriMoji = "あと " + nokori + " 人";
    } else {
      nokoriMoji = "そろった";
    }

    // 入力欄の部分を作る（開いているときだけ中身を入れる）
    let nyuuryokuBubun = "";
    if (kai.hiraiteru) {
      nyuuryokuBubun =
        '<div class="nyuuryoku">' +
          '<input id="namae-ran-' + bangou + '" placeholder="名前">' +
          '<button onclick="namaeWoTasu(' + bangou + ')">追加</button>' +
        '</div>';
    }

    // 1件分のカードを作る
    const card = document.createElement("div");
    card.className = "kai";

    card.innerHTML =
      '<div class="kai-atama" onclick="kirikaeru(' + bangou + ')">' +
        '<div class="event-mei">' + kai.eventMei + '</div>' +
        '<div class="hizuke">' + kai.hizuke + '</div>' +
        '<div class="nokori ' + (nokori > 0 ? '' : 'ok') + '">' + nokoriMoji + '</div>' +
        '<div class="namae-list">' +
          '出演決定 ' + kai.shutsuensha.length + ' / ' + kai.hitsuyouNinzuu + ' 人<br>' +
          kai.shutsuensha.join("、") +
        '</div>' +
      '</div>' +
      nyuuryokuBubun;

    basho.appendChild(card);
  }
}

// 起動したら書き出す
kakidasu();
</script>

</body>
</html>
